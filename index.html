function fmtMonedaExcel(moneda) {
  if (moneda === "U$S")   return '"U$S "#,##0.00';
  if (moneda === "Euros") return '"€ "#,##0.00';
  if (moneda === "CLP")   return '"CLP "#,##0';
  return '"$ "#,##0.00';
}

function aplicarEstilosHoja(ws, rows, numCatCols, extraCols, hasId) {
  numCatCols = numCatCols || 1;
  const off = extraCols || 0;                 // columnas extra insertadas después de "Empresa"
  const colMonedaIdx0 = 6 + numCatCols + off; // índice 0-based dentro del array de la fila
  const colMontoTotal1 = 8 + numCatCols + off;  // columna 1-based de Excel
  const colPrecioUnit1 = 10 + numCatCols + off; // columna 1-based de Excel ("Precio Unitario")
  const colMontoCuota1 = 12 + numCatCols + off; // columna 1-based de Excel (se corrió +2 por Cantidad/Precio Unitario)
  const totalCols = 15 + numCatCols + off;

  const HEADER_FILL = { type:"pattern", pattern:"solid", fgColor:{argb:"FF1E3A5F"} };
  const HEADER_FONT = { name:"Arial", bold:true, color:{argb:"FFFFFFFF"}, size:10 };
  const BODY_FONT   = { name:"Arial", size:10 };
  const BRD         = { style:"thin", color:{argb:"FFD0D0D0"} };
  const BORDER      = { top:BRD, left:BRD, bottom:BRD, right:BRD };

  ws.getRow(1).eachCell(cell => {
    cell.font = HEADER_FONT;
    cell.fill = HEADER_FILL;
    cell.alignment = { vertical:"middle", horizontal:"center" };
    cell.border = BORDER;
  });
  ws.getRow(1).height = 20;

  rows.forEach((row, ri) => {
    const exRow = ws.getRow(ri + 2);
    const zebra = ri % 2 === 0;
    const moneda = row[colMonedaIdx0] || "ARS";
    exRow.eachCell({ includeEmpty:true }, (cell, colIdx) => {
      cell.font = BODY_FONT;
      cell.border = BORDER;
      cell.alignment = { vertical:"middle" };
      if (zebra) cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:"FFF5F8FF"} };
      if (colIdx === 1 && cell.value) {
        const d = new Date(cell.value + "T00:00:00");
        if (!isNaN(d)) { cell.value = d; cell.numFmt = "dd/mm/yyyy"; }
      }
      if ((colIdx === colMontoTotal1 || colIdx === colPrecioUnit1 || colIdx === colMontoCuota1) && typeof cell.value === "number") {
        cell.numFmt = fmtMonedaExcel(moneda);
        cell.alignment = { vertical:"middle", horizontal:"right" };
      }
    });
    exRow.height = 18;
  });

  const widths = [12,12, ...Array(off).fill(10), 24,32, ...Array(numCatCols).fill(18), 16,16,8,14,10,12,10,14,28,12,8];
  widths.forEach((w,i) => { ws.getColumn(i+1).width = w; });
  ws.views = [{ state:"frozen", ySplit:1 }];
  ws.autoFilter = { from:{row:1,column:1}, to:{row:1,column:totalCols} };
  // Columna ID: identifica cada gasto para poder reimportar ediciones (ej. cambio de categoría)
  // sin duplicar. Se oculta para no invitar a tocarla a mano.
  if (hasId) {
    const idCol = ws.getColumn(totalCols + 1);
    idCol.width = 12;
    idCol.hidden = true;
  }
}

function colLetter(n) {
  let s = "";
  while (n > 0) { const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = Math.floor((n-1)/26); }
  return s;
}

// Crea una hoja oculta con las listas maestras (empresas, categorías, medios, subtipos, monedas)
// y devuelve los rangos para usar en las validaciones de datos (dropdowns) de las demás hojas.
function crearHojaListas(wb) {
  const ws = wb.addWorksheet("Listas");
  ws.state = "hidden";
  const medios = Object.keys(MEDIOS).sort((a,b)=>a.localeCompare(b));
  const subtiposFlat = [...new Set(Object.values(MEDIOS).flatMap(m=>m.sub||[]))].sort((a,b)=>a.localeCompare(b));
  const monedas = ["ARS","U$S","Euros","CLP"];
  const catsProyecto = state.categorias.filter(c => esCatProyecto(c));
  const catsTipo = state.categorias.filter(c => !esCatProyecto(c));
  const cols = [
    {header:"Empresa", values: EMPRESAS},
    {header:"Categoría", values: state.categorias},
    {header:"Categoría Proyecto/Viaje", values: catsProyecto},
    {header:"Categoría Tipo de gasto", values: catsTipo},
    {header:"Medio de pago", values: medios},
    {header:"Subtipo", values: subtiposFlat},
    {header:"Moneda", values: monedas},
    {header:"Empresa o Split", values: [...EMPRESAS, "Split"]},
  ];
  cols.forEach((c, ci) => {
    ws.getCell(1, ci+1).value = c.header;
    c.values.forEach((v, ri) => { ws.getCell(ri+2, ci+1).value = v; });
  });
  const rango = (colIdx1, n) => `Listas!$${colLetter(colIdx1)}$2:$${colLetter(colIdx1)}$${Math.max(n,1)+1}`;
  return {
    empresaRange: rango(1, EMPRESAS.length),
    categoriaRange: rango(2, state.categorias.length),
    categoriaProyectoRange: rango(3, catsProyecto.length),
    categoriaTipoRange: rango(4, catsTipo.length),
    medioRange: rango(5, medios.length),
    subtipoRange: rango(6, subtiposFlat.length),
    monedaRange: rango(7, monedas.length),
    empresaSplitRange: rango(8, EMPRESAS.length+1),
  };
}

// Aplica dropdowns (validación de datos) a una hoja de gastos, incluyendo filas vacías
// para que al agregar filas nuevas para carga masiva también tengan la lista.
function aplicarValidacionesHoja(ws, numCatCols, ranges, maxFilas, extraCols, empresaRangeOverride, numProyCols) {
  maxFilas = maxFilas || 500;
  const off = extraCols || 0;
  const colEmpresa = colLetter(2);
  const colMedio = colLetter(5+numCatCols+off);
  const colSubtipo = colLetter(6+numCatCols+off);
  const colMoneda = colLetter(7+numCatCols+off);
  const dv = (range) => ({ type:"list", allowBlank:true, formulae:[range] });

  ws.dataValidations.add(`${colEmpresa}2:${colEmpresa}${maxFilas}`, dv(empresaRangeOverride || ranges.empresaRange));
  for (let c=0; c<numCatCols; c++) {
    const colC = colLetter(5+c+off);
    // Si viene numProyCols, las primeras columnas son exclusivas de Proyecto/Viaje y el resto
    // de Tipo de gasto (dos dropdowns separados); si no, todas comparten el listado completo
    // (comportamiento anterior, usado por la plantilla en blanco).
    const range = numProyCols ? (c < numProyCols ? ranges.categoriaProyectoRange : ranges.categoriaTipoRange) : ranges.categoriaRange;
    ws.dataValidations.add(`${colC}2:${colC}${maxFilas}`, dv(range));
  }
  ws.dataValidations.add(`${colMedio}2:${colMedio}${maxFilas}`, dv(ranges.medioRange));
  ws.dataValidations.add(`${colSubtipo}2:${colSubtipo}${maxFilas}`, dv(ranges.subtipoRange));
  ws.dataValidations.add(`${colMoneda}2:${colMoneda}${maxFilas}`, dv(ranges.monedaRange));
  const colPagador = colLetter(14+numCatCols+off);
  ws.dataValidations.add(`${colPagador}2:${colPagador}${maxFilas}`, dv(ranges.empresaRange));
}

// ── Importación desde Excel ────────────────────────────────────
function parseFechaImport(val) {
  if (val === null || val === undefined || val === "") return null;
  if (val instanceof Date) {
    // ExcelJS devuelve las fechas de Excel como medianoche UTC. Si leemos con getters
    // locales, en zonas con offset negativo (ej. UTC-3) la fecha se corre un día atrás.
    const y=val.getUTCFullYear(), m=String(val.getUTCMonth()+1).padStart(2,"0"), d=String(val.getUTCDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  if (typeof val === "number") {
    // Serial de fecha de Excel (días desde 1899-12-30)
    const ms = Math.round((val - 25569) * 86400 * 1000);
    const d = new Date(ms);
    const y=d.getUTCFullYear(), m=String(d.getUTCMonth()+1).padStart(2,"0"), day=String(d.getUTCDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  const s = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (dmy) { const [,d,m,y]=dmy; return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  const parsed = new Date(s);
  if (!isNaN(parsed)) {
    const y=parsed.getFullYear(), m=String(parsed.getMonth()+1).padStart(2,"0"), d=String(parsed.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  return null;
}

async function handleImportExcel(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = "";
  showToast("Leyendo archivo...");
  try {
    const buf = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);

    // Si hay una hoja "Todos" (export completo), usar solo esa para no duplicar
    // lo que ya está repetido en las hojas por empresa. La hoja "Listas" es interna
    // (fuente de los desplegables) y nunca se procesa como datos.
    const hojasDatos = wb.worksheets.filter(ws => ws.name !== "Listas");
    const todosSheet = hojasDatos.find(ws => ws.name === "Todos");
    const hojas = todosSheet ? [todosSheet] : hojasDatos;

    const nuevos = [];
    const errores = [];
    const actualizaciones = [];   // filas con ID que matchea un gasto existente y trae cambios
    const sinCambiosIds = [];     // filas con ID que matchea pero sin diferencias
    const noEncontrados = [];     // filas con ID que ya no existe (el gasto se borró)
    const _byId = new Map(state.gastos.map(g => [String(g.id), g]));

    hojas.forEach(ws => {
      const headerRow = ws.getRow(1);
      const colMap = {};
      const catCols = [];
      headerRow.eachCell((cell, colIdx) => {
        const h = String(cell.value||"").trim().toLowerCase();
        if (h.startsWith("categoría") || h.startsWith("categoria")) catCols.push(colIdx);
        else if (h) colMap[h] = colIdx;
      });
      const get = (row, key) => { const idx = colMap[key]; if(!idx) return ""; const c = row.getCell(idx); return (c && c.value !== null && c.value !== undefined) ? c.value : ""; };

      const totalRows = ws.rowCount;
      for (let r = 2; r <= totalRows; r++) {
        const row = ws.getRow(r);
        if (row.actualCellCount === 0) continue;

        const empresaRaw = String(get(row,"empresa")||"").trim();
        const isSplit = empresaRaw.toLowerCase() === "split";
        const empresa = isSplit ? null : EMPRESAS.find(e => e.toLowerCase() === empresaRaw.toLowerCase());
        const cantidadVal = parseFloat(get(row,"cantidad"));
        const precioUnitVal = parseFloat(get(row,"precio unitario"));
        let monto = parseFloat(get(row,"monto total"));
        // Si no hay Monto Total pero sí Cantidad + Precio Unitario, se calcula solo (mismo criterio
        // que al cargar desde la app).
        if ((!monto || monto<=0) && cantidadVal>0 && precioUnitVal>0) monto = Math.round(cantidadVal*precioUnitVal*100)/100;
        const fecha = parseFechaImport(get(row,"fecha"));

        if (!isSplit && !empresa) { errores.push(`Hoja "${ws.name}" fila ${r}: empresa "${empresaRaw}" no reconocida`); continue; }
        if (!fecha) { errores.push(`Hoja "${ws.name}" fila ${r}: fecha inválida`); continue; }
        if (!monto || monto<=0) { errores.push(`Hoja "${ws.name}" fila ${r}: monto inválido`); continue; }

        let splitPartes = null;
        if (isSplit) {
          const splitRaw = String(get(row,"split %")||"").trim();
          const partesPct = splitRaw.split("/").map(s => parseFloat(s.trim()));
          if (partesPct.length !== 2 || partesPct.some(p => isNaN(p))) { errores.push(`Hoja "${ws.name}" fila ${r}: "Split %" inválido ("${splitRaw}")`); continue; }
          if (Math.round(partesPct[0]+partesPct[1]) !== 100) { errores.push(`Hoja "${ws.name}" fila ${r}: "Split %" no suma 100 (${splitRaw})`); continue; }
          splitPartes = [{empresa:"CDM",pct:partesPct[0]},{empresa:"LCK",pct:partesPct[1]}];
        }

        const categorias = catCols.map(ci => { const c = row.getCell(ci); if(!c || !c.value) return ""; const raw = String(c.value).trim(); return raw.toLowerCase() === "sin categoría" ? "Sin categoría" : normCatName(raw); }).filter(Boolean);
        const medioBase = String(get(row,"medio de pago")||"").trim();
        const subtipo = String(get(row,"subtipo")||"").trim();
        const monedaRaw = String(get(row,"moneda")||"").trim();
        const moneda = ["ARS","U$S","Euros","CLP"].includes(monedaRaw) ? monedaRaw : "ARS";
        const pagadorRaw = String(get(row,"pagado por")||"").trim();
        const horaRaw = get(row,"hora");
        let hora = null;
        if (horaRaw instanceof Date) hora = String(horaRaw.getUTCHours()).padStart(2,"0")+":"+String(horaRaw.getUTCMinutes()).padStart(2,"0");
        else if (typeof horaRaw === "number") { const t=Math.round(horaRaw*24*60); hora = String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }
        else { const s=String(horaRaw||"").trim(); const mH=s.match(/^(\d{1,2}):(\d{2})/); if(mH) hora = mH[1].padStart(2,"0")+":"+mH[2]; }
        const pagador = EMPRESAS.find(e => e.toLowerCase() === pagadorRaw.toLowerCase()) || null;
        const cantCuotasRaw = get(row,"cant. cuotas");
        const cantCuotas = cantCuotasRaw ? parseInt(cantCuotasRaw) : null;
        const montoCuotaRaw = get(row,"monto/cuota");
        let montoCuota = montoCuotaRaw ? parseFloat(montoCuotaRaw) : null;
        if (!montoCuota && cantCuotas>0) montoCuota = Math.round(monto/cantCuotas*100)/100;

        const titular = String(get(row,"titular/comercio")||"").trim();
        const desc = String(get(row,"descripción")||get(row,"descripcion")||"").trim() || "Sin descripción";
        const medio = medioStr(medioBase||null, subtipo||null) || medioBase || "No especificado";
        const nota = String(get(row,"nota")||"").trim();

        // Si la fila trae ID (columna oculta que agregamos al exportar), es una edición de un
        // gasto ya cargado (ej. cambio de categoría) y no un alta nueva. Actualizamos in-place
        // en vez de compararla por fecha/monto/medio, así nunca se duplica. No tocamos monto ni
        // cuotas acá: una edición masiva pensada para categoría/descripción no debería poder
        // pisar montos por un error de tipeo en el Excel.
        const idRaw = String(get(row,"id")||"").trim();
        if (idRaw) {
          const existente = _byId.get(idRaw);
          if (!existente) {
            noEncontrados.push(`Hoja "${ws.name}" fila ${r}: ID ${idRaw} no corresponde a ningún gasto (¿se borró?) — se omite`);
            continue;
          }
          const cambios = {
            titular, desc,
            categorias: categorias.length ? categorias : ["Sin categoría"],
            medio, moneda, fecha, hora, nota, pagador,
          };
          if (!isSplit && empresa) cambios.empresa = empresa;
          const _norm = v => Array.isArray(v) ? JSON.stringify([...v].sort()) : (v ?? "");
          const _valorActual = k => k === "categorias" ? getCats(existente) : existente[k];
          const huboCambio = Object.keys(cambios).some(k => _norm(_valorActual(k)) !== _norm(cambios[k]));
          if (huboCambio) actualizaciones.push({ existente, cambios });
          else sinCambiosIds.push(idRaw);
          continue;
        }

        if (isSplit) {
          const groupId = Date.now() + nuevos.length;
          splitPartes.forEach((p,i) => {
            const montoParte = Math.round(monto*p.pct/100*100)/100;
            const cantCuotasParte = cantCuotas>0?cantCuotas:null;
            const montoCuotaParte = cantCuotasParte ? Math.round(montoParte/cantCuotasParte*100)/100 : null;
            nuevos.push({
              id: groupId + i,
              empresa: p.empresa, fecha,
              titular,
              desc,
              categorias: categorias.length ? categorias : ["Sin categoría"],
              medio,
              moneda, monto: montoParte,
              cantCuotas: cantCuotasParte,
              montoCuota: montoCuotaParte,
              cantidad: cantidadVal>0?cantidadVal:null,
              precioUnit: precioUnitVal>0?precioUnitVal:null,
              nota: `${nota?nota+" · ":""}División ${p.pct}%`,
              pagador,
              hora,
              splitGroupId: groupId,
              splitPct: p.pct,
              updatedAt: Date.now(),
            });
          });
        } else {
          nuevos.push({
            id: Date.now() + nuevos.length,
            empresa, fecha,
            titular,
            desc,
            categorias: categorias.length ? categorias : ["Sin categoría"],
            medio,
            moneda, monto,
            cantCuotas: cantCuotas>0?cantCuotas:null,
            montoCuota: montoCuota>0?montoCuota:null,
            cantidad: cantidadVal>0?cantidadVal:null,
            precioUnit: precioUnitVal>0?precioUnitVal:null,
            nota,
            pagador,
            hora,
            updatedAt: Date.now(),
          });
        }
      }
    });

    if (!nuevos.length && !actualizaciones.length) {
      if (errores.length || noEncontrados.length) console.warn("Errores de importación:", errores, noEncontrados);
      const partes = [];
      if (sinCambiosIds.length) partes.push(`${sinCambiosIds.length} sin cambios`);
      if (noEncontrados.length) partes.push(`${noEncontrados.length} con ID no encontrado`);
      if (errores.length) partes.push(`${errores.length} con error`);
      showToast(partes.length ? `⚠ Nada para importar (${partes.join(", ")}, ver consola)` : "⚠ El archivo no tiene filas para importar");
      return;
    }

    const _sig=x=>(x.empresa||"")+"|"+(x.fecha||"")+"|"+Math.round((parseFloat(x.monto)||0)*100)+"|"+(x.medio||"");
    const _ex=new Map(); state.gastos.forEach(g=>{ if(!_ex.has(_sig(g))) _ex.set(_sig(g), g); });
    const _add=[], _dupPares=[];
    nuevos.forEach(x => { const y=_ex.get(_sig(x)); if (y) _dupPares.push({nuevo:x, existente:y}); else _add.push(x); });
    const _dups=_dupPares.length;
    // Detalle de los omitidos, para poder identificarlos sin adivinar
    const _detalleDup = _dupPares.map(({nuevo,existente}) =>
      `• ${nuevo.fecha} · ${nuevo.empresa} · ${fmtMonto(nuevo.monto, nuevo.moneda)} · ${nuevo.titular||nuevo.desc}`
      + `\n   ya existe como: "${existente.titular||existente.desc}"${existente.nota?` (${existente.nota})`:""}`);
    if (_dups) console.warn("Gastos omitidos por duplicado:", _dupPares);

    if (!_add.length && !actualizaciones.length) {
      const partes = [];
      if (_dups) partes.push(`${_dups} duplicado${_dups!==1?"s":""}`);
      if (sinCambiosIds.length) partes.push(`${sinCambiosIds.length} sin cambios`);
      if (noEncontrados.length) partes.push(`${noEncontrados.length} con ID no encontrado`);
      alert(`Nada nuevo para importar${partes.length?` (${partes.join(", ")})`:""}${_dups?`:\n\n${_detalleDup.join("\n")}`:""}`);
      return;
    }

    const _msgPartes = [];
    if (_add.length) _msgPartes.push(`${_add.length} gasto${_add.length!==1?"s":""} nuevo${_add.length!==1?"s":""}`);
    if (actualizaciones.length) _msgPartes.push(`${actualizaciones.length} actualizado${actualizaciones.length!==1?"s":""} (categoría/otros campos)`);
    let msg = `¿Importar? ${_msgPartes.join(" · ")}`;
    if (_dups) msg += `\n${_dups} ya cargado${_dups!==1?"s":""} (se omite${_dups!==1?"n":""} por duplicado)`;
    if (sinCambiosIds.length) msg += `\n${sinCambiosIds.length} sin cambios`;
    if (noEncontrados.length) msg += `\n${noEncontrados.length} con ID que ya no existe (se omite${noEncontrados.length!==1?"n":""})`;
    if (_dups) msg += `\n\nOmitido${_dups!==1?"s":""} por estar ya cargado${_dups!==1?"s":""}:\n${_detalleDup.slice(0,10).join("\n")}${_dups>10?`\n… y ${_dups-10} más (ver consola)`:""}`;
    if (errores.length) msg += `\n\n${errores.length} fila${errores.length!==1?"s":""} se van a omitir por datos inválidos (detalle en la consola).`;
    if (!confirm(msg)) return;

    state.gastos = [...state.gastos, ..._add];
    actualizaciones.forEach(({existente, cambios}) => { Object.assign(existente, cambios, {updatedAt: Date.now()}); });

    // Registrar categorías nuevas que vengan del Excel y todavía no estén en la lista
    const catsNuevas = [];
    [..._add, ...actualizaciones.map(a=>a.cambios)].forEach(g => getCats(g).forEach(c => {
      if (c && c !== "Sin categoría" && !state.categorias.includes(c) && !catsNuevas.includes(c)) catsNuevas.push(c);
    }));
    if (catsNuevas.length) {
      state.categorias = [...state.categorias, ...catsNuevas];
      // Si alguna estaba tombstoneada por un borrado previo, la sacamos del tombstone
      if (Array.isArray(state.deletedCategorias) && state.deletedCategorias.length) {
        state.deletedCategorias = state.deletedCategorias.filter(c => !catsNuevas.includes(c));
        localStorage.setItem("deleted_cats_v1", JSON.stringify(state.deletedCategorias));
      }
      console.log("Categorías nuevas agregadas desde el Excel:", catsNuevas);
    }

    saveAll();
    render();
    if (errores.length || noEncontrados.length) console.warn("Filas omitidas en la importación:", errores, noEncontrados);
    const _resumen = [];
    if (_add.length) _resumen.push(`${_add.length} agregado${_add.length!==1?"s":""}`);
    if (actualizaciones.length) _resumen.push(`${actualizaciones.length} actualizado${actualizaciones.length!==1?"s":""}`);
    if (_dups) _resumen.push(`${_dups} duplicado${_dups!==1?"s":""} omitido${_dups!==1?"s":""}`);
    if (errores.length) _resumen.push(`${errores.length} con error`);
    showToast(`✓ ${_resumen.join(" · ")}`);
  } catch(e) {
    console.error("Error importando Excel:", e);
    showToast("⚠ Error leyendo el archivo: " + e.message);
  }
}

async function descargarPlantillaExcel() {
  const wb = new ExcelJS.Workbook();
  wb.creator = "Gastos App"; wb.created = new Date();
  const numCat = 3;
  const catHeaders = Array.from({length:numCat},(_,i)=>`Categoría ${i+1}`);
  const headers = ["Fecha","Empresa","Split %","Titular/Comercio","Descripción",...catHeaders,"Medio de pago","Subtipo","Moneda","Monto Total","Cantidad","Precio Unitario","Cant. Cuotas","Monto/Cuota","Nota","Pagado por","Hora"];
  const ws = wb.addWorksheet("Plantilla");
  ws.addRow(headers);
  aplicarEstilosHoja(ws, [], numCat, 1);
  const ranges = crearHojaListas(wb);
  aplicarValidacionesHoja(ws, numCat, ranges, 500, 1, ranges.empresaSplitRange);
  // Nota de ayuda en el encabezado de Split %
  ws.getCell(1,3).note = "Solo si Empresa = Split. Formato: 66/34 (primero CDM, después LCK). Debe sumar 100.";
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download = "plantilla_gastos.xlsx";
  a.click();
  showToast("✓ Plantilla descargada");
}

async function exportarExcel(soloEmp) {
  if(!state.gastos.length) return showToast("No hay gastos para exportar");
  const wb = new ExcelJS.Workbook();
  wb.creator = "Gastos App"; wb.created = new Date();
  const splitMedio = g => { const p=(g.medio||"").split(" · "); return [p[0]||"",p[1]||""]; };
  // Columna(s) de categoría exclusivas para Proyecto/Viaje primero (en blanco si el gasto no
  // tiene ninguna), y recién después las de Tipo de gasto — así nunca se mezclan en la misma
  // celda y queda claro/editable en el Excel a qué eje pertenece cada una.
  // Orden estable: dentro de cada gasto, las categorías se ordenan por frecuencia de uso global
  // (la más usada en el total de gastos gana la columna Categoría 1), y a igual frecuencia por
  // su posición en la pestaña Categorías. Así el mismo par de categorías siempre cae en el mismo
  // orden entre gastos distintos, y la categoría más común no queda a la suerte de cuál se tildó
  // primero al cargar cada gasto puntual.
  const freqCat = {};
  state.gastos.forEach(g => getCats(g).forEach(c => { freqCat[c] = (freqCat[c]||0) + 1; }));
  const ordenCat = (a,b) => (freqCat[b]||0) - (freqCat[a]||0) || (state.categorias.indexOf(a) - state.categorias.indexOf(b));
  const catsProy = g => getCats(g).filter(c => esCatProyecto(c)).sort(ordenCat);
  const catsTipo = g => getCats(g).filter(c => !esCatProyecto(c)).sort(ordenCat);
  const catHeaders = (mp,mt) => [
    ...Array.from({length:mp},(_,i)=> mp<=1 ? "Categoría Proyecto/Viaje" : `Categoría Proyecto/Viaje ${i+1}`),
    ...Array.from({length:mt},(_,i)=> mt<=1 ? "Categoría" : `Categoría ${i+1}`),
  ];
  const buildHeaders = (mp,mt) => ["Fecha","Empresa","Titular/Comercio","Descripción",...catHeaders(mp,mt),"Medio de pago","Subtipo","Moneda","Monto Total","Cantidad","Precio Unitario","Cant. Cuotas","Monto/Cuota","Nota","Pagado por","Hora","ID"];
  const toRow = (g,mp,mt) => {
    const proyCols = Array.from({length:mp},(_,i)=>catsProy(g)[i]||"");
    const tipoCols = Array.from({length:mt},(_,i)=>catsTipo(g)[i]||"");
    return [g.fecha, g.empresa, g.titular||"", g.desc, ...proyCols, ...tipoCols, ...splitMedio(g), g.moneda||"ARS", g.monto, g.cantidad||"", g.precioUnit||"", g.cantCuotas||"", g.montoCuota||"", g.nota||"", g.pagador||"", g.hora||"", String(g.id)];
  };

  const descargar = async (nombre) => {
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download = nombre; a.click();
  };

  const fechaFiltro = g => (!state.exportDesde||g.fecha>=state.exportDesde)&&(!state.exportHasta||g.fecha<=state.exportHasta);
  const sufFecha = (state.exportDesde||state.exportHasta) ? `_${state.exportDesde||"inicio"}_${state.exportHasta||"hoy"}` : "";

  let ranges = null;
  const addSheet = (nombreHoja, gastosArr) => {
    const maxProy = Math.max(1, ...gastosArr.map(g=>catsProy(g).length));
    const maxTipo = Math.max(1, ...gastosArr.map(g=>catsTipo(g).length));
    const headers = buildHeaders(maxProy, maxTipo);
    const rows = gastosArr.map(g=>toRow(g,maxProy,maxTipo));
    const ws = wb.addWorksheet(nombreHoja);
    ws.addRow(headers); rows.forEach(r=>ws.addRow(r));
    aplicarEstilosHoja(ws, rows, maxProy+maxTipo, 0, true);
    if (!ranges) ranges = crearHojaListas(wb);
    aplicarValidacionesHoja(ws, maxProy+maxTipo, ranges, undefined, undefined, undefined, maxProy);
    return rows.length;
  };

  if (soloEmp) {
    const gastosArr = state.gastos.filter(g=>g.empresa===soloEmp&&fechaFiltro(g)).sort((a,b)=>cmpGastoDesc(b,a));
    if (!gastosArr.length) return showToast(`Sin gastos para ${soloEmp}${sufFecha?" en ese período":""}`);
    const n = addSheet(soloEmp, gastosArr);
    await descargar(`gastos_${soloEmp}${sufFecha}_${hoy()}.xlsx`);
    showToast(`✓ Excel ${soloEmp} exportado (${n} gastos)`);
    return;
  }

  EMPRESAS.forEach(emp => {
    const gastosArr = state.gastos.filter(g=>g.empresa===emp&&fechaFiltro(g)).sort((a,b)=>cmpGastoDesc(b,a));
    addSheet(emp, gastosArr);
  });
  const allArr = [...state.gastos].filter(fechaFiltro).sort((a,b)=>cmpGastoDesc(b,a));
  const totalN = addSheet("Todos", allArr);
  await descargar(`gastos${sufFecha}_${hoy()}.xlsx`);
  showToast(`✓ Excel exportado (${totalN} gastos)`);
}

async function exportarBusqueda() {
  const resultados = getFiltradosBusqueda();
  if(!resultados||!resultados.length) return showToast("Sin resultados para exportar");
  const splitMedio = g => { const p=(g.medio||"").split(" · "); return [p[0]||"",p[1]||""]; };
  const sorted = [...resultados].sort((a,b)=>cmpGastoDesc(b,a));
  // Igual que en exportarExcel: Proyecto/Viaje siempre en las primeras columnas (en blanco si no
  // tiene), Tipo de gasto después. Orden por frecuencia de uso global (la más usada gana la
  // Categoría 1), empate por posición en la pestaña Categorías — así el mismo par de categorías
  // siempre cae en el mismo orden entre gastos distintos.
  const freqCat = {};
  state.gastos.forEach(g => getCats(g).forEach(c => { freqCat[c] = (freqCat[c]||0) + 1; }));
  const ordenCat = (a,b) => (freqCat[b]||0) - (freqCat[a]||0) || (state.categorias.indexOf(a) - state.categorias.indexOf(b));
  const catsProy = g => getCats(g).filter(c => esCatProyecto(c)).sort(ordenCat);
  const catsTipo = g => getCats(g).filter(c => !esCatProyecto(c)).sort(ordenCat);
  const maxProy = Math.max(1, ...sorted.map(g=>catsProy(g).length));
  const maxTipo = Math.max(1, ...sorted.map(g=>catsTipo(g).length));
  const catHeaders = [
    ...Array.from({length:maxProy},(_,i)=> maxProy<=1 ? "Categoría Proyecto/Viaje" : `Categoría Proyecto/Viaje ${i+1}`),
    ...Array.from({length:maxTipo},(_,i)=> maxTipo<=1 ? "Categoría" : `Categoría ${i+1}`),
  ];
  const headers = ["Fecha","Empresa","Titular/Comercio","Descripción",...catHeaders,"Medio de pago","Subtipo","Moneda","Monto Total","Cantidad","Precio Unitario","Cant. Cuotas","Monto/Cuota","Nota","Pagado por","Hora","ID"];
  const rows = sorted.map(g=>{
    const proyCols = Array.from({length:maxProy},(_,i)=>catsProy(g)[i]||"");
    const tipoCols = Array.from({length:maxTipo},(_,i)=>catsTipo(g)[i]||"");
    return [g.fecha, g.empresa, g.titular||"", g.desc, ...proyCols, ...tipoCols, ...splitMedio(g), g.moneda||"ARS", g.monto, g.cantidad||"", g.precioUnit||"", g.cantCuotas||"", g.montoCuota||"", g.nota||"", g.pagador||"", g.hora||"", String(g.id)];
  });
  const wb = new ExcelJS.Workbook();
  wb.creator = "Gastos App"; wb.created = new Date();
  const labelHoja = (state.busqueda||state.filtroBEmp||(state.filtroBCats&&state.filtroBCats.join("+"))||"busqueda").replace(/[^a-zA-Z0-9 áéíóúñÁÉÍÓÚÑ+]/g,"").trim().slice(0,28) || "Busqueda";
  const ws = wb.addWorksheet(labelHoja);
  ws.addRow(headers); rows.forEach(r=>ws.addRow(r));
  aplicarEstilosHoja(ws, rows, maxProy+maxTipo, 0, true);
  const ranges = crearHojaListas(wb);
  aplicarValidacionesHoja(ws, maxProy+maxTipo, ranges, undefined, undefined, undefined, maxProy);
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download = `busqueda_${labelHoja.replace(/\s+/g,"_")}_${hoy()}.xlsx`;
  a.click();
  showToast(`✓ Excel exportado (${resultados.length} gastos)`);
}

// ── Init ──────────────────────────────────────────────────────
localStorage.removeItem("plants_v5");
localStorage.removeItem("deleted_plants_v1");
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch(e => console.error("SW error:", e));
  });
}
handleOAuthCallback();
render();
if (driveEnabled()) { loadFromDrive().then(migrarCatJetsmartTraslados).then(normalizarCasingCategorias).then(normalizarCategoriasDeGastos); } else { migrarCatJetsmartTraslados(); normalizarCasingCategorias(); normalizarCategoriasDeGastos(); }
// Sync periódico cada 2 minutos si hay conexión activa con Drive
setInterval(() => {
  if (refrescarFechaSiCorresponde()) render();
  if (driveEnabled() && state.syncStatus !== "syncing") loadFromDrive();
}, 2 * 60 * 1000);
// Sync al volver a la pestaña/app (visibilitychange)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (refrescarFechaSiCorresponde()) render();
    if (driveEnabled() && state.syncStatus !== "syncing" && !state.isOffline) {
      loadFromDrive();
    }
  }
});
// Detectar cambios de conectividad
window.addEventListener("offline", () => {
  setState({isOffline: true}, false);
  render();
  showToast("⚡ Sin conexión — los cambios se guardan localmente");
});
window.addEventListener("online", () => {
  setState({isOffline: false}, false);
  render();
  showToast("✓ Conexión restaurada — sincronizando...");
  if (driveEnabled() && state.syncStatus !== "syncing") {
    // Pequeña pausa para que la red esté realmente disponible
    setTimeout(() => loadFromDrive(), 1500);
  }
});
