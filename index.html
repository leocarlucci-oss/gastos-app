<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Gestor de Gastos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0F0F11;--surface:#18181C;--border:#2A2A30;--text:#F0F0F5;--muted:#8888A0;
  --accent:#F59E0B;--c2:#2563EB;--nafil:#059669;--mb:#EA580C;--cdm:#DC2626;--lck:#7C3AED;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 16px 80px;}
.app{max-width:600px;margin:0 auto;}
input,select,textarea,button{font-family:inherit;}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:10px 12px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:#1a1a20;}
textarea{resize:vertical;}
button{cursor:pointer;}
.label{display:block;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
.field{margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-primary{width:100%;padding:12px;background:var(--accent);color:#0F0F11;border:none;border-radius:8px;font-size:14px;font-weight:600;margin-top:4px;}
.btn-primary:disabled{opacity:.4;}
.emp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin:0 0 20px;}
.tab{flex:1;padding:8px 2px;border:none;background:transparent;color:var(--muted);font-size:11px;border-radius:7px;font-weight:500;}
.tab.active{background:var(--border);color:var(--text);}
.filter-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.filter-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-family:'DM Mono',monospace;}
.filter-btn.active{border-color:var(--accent);color:var(--accent);}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.gasto-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.gasto-desc{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gasto-meta{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;}
.gasto-nota{font-size:11px;color:#555;margin-top:1px;}
.gasto-monto{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;flex-shrink:0;text-align:right;}
.btn-icon{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 4px;flex-shrink:0;}
.medio-tipos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.medio-tipo-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-family:'DM Mono',monospace;}
.medio-subs{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--border);}
.medio-sub-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;white-space:nowrap;}
.split-toggle{display:flex;gap:8px;margin-bottom:16px;}
.split-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-family:'DM Mono',monospace;}
.split-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(245,158,11,.12);}
.split-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.pct-wrap{flex:1;position:relative;}
.pct-sym{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none;}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;}
.upload-zone:hover{border-color:var(--accent);}
.preview-img{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin-top:12px;}
.ia-result{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:14px;}
.sugerencia{margin-top:6px;padding:8px 12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:8px;display:flex;align-items:center;justify-content:space-between;}
.sync-badge{font-family:'DM Mono',monospace;font-size:11px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E1E26;border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;}
.toast.show{opacity:1;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:500px;margin-top:20px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.cats-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;}
.cats-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;}
.cat-item{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:8px 12px;border:1px solid var(--border);margin-bottom:6px;}
.plantilla-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.res-card{border-radius:10px;padding:14px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ── Datos ─────────────────────────────────────────────────────
const EMPRESAS = ["C2","Nafil","MB","CDM","LCK"];
const ANTHROPIC_MODEL = "claude-sonnet-4-5";
const DRIVE_FILE_NAME = "gastos_app_data.json";
const DRIVE_CLIENT_ID = "1051749004626-0h5d41e0uq148uq2srrvvfu3p1f9cckk.apps.googleusercontent.com";

const CATEGORIAS_DEFAULT = ["Combustible","Alimentación","Equipamiento","Mantenimiento","Transporte","Servicios","Honorarios","Marketing","Insumos","Otros"];

const MEDIOS = {
  Tx:       {color:"#38BDF8",sub:["Santander BW","Santander NF","Santander LC","Galicia C2","Galicia BW","Galicia LC","Supervielle C2","Supervielle LC","BBVA AK","BBVA LC","CIU AK","CIU BW","CIU NF","Macro LC"]},
  "TC ARS": {color:"#A78BFA",sub:["Mastercard Supervielle Leandro","Mastercard BBVA Leandro","Mastercard Ciudad Mama","AMEX Leandro","Visa Santander Leandro","Visa BBVA Leandro","Visa BBVA Mama","Mastercard BBVA Mamá","Visa Ciudad Mama","AMEX Santander Leandro","Mastercard Ciudad Leandro","Mercadopago Master","VISA MACRO","AMEX MACRO","Visa Supervielle Leandro","Mastercard Cencosud Leandro","Visa GALICIA","MC Galicia"]},
  "TC U$S": {color:"#34D399",sub:["Visa Chase","MC Citi"]},
  "TC EUR": {color:"#FCD34D",sub:["Santander débito","Caixabank débito"]},
  Cash:     {color:"#FB923C",sub:["ARS","U$S","Euros","CLP"]},
  MP:       {color:"#60A5FA",sub:["MP LC","MP C2","MP AK"]},
  PayPal:   {color:"#003087",sub:[]},
  Bizum:    {color:"#00CFFF",sub:[]},
  Zelle:    {color:"#6D1ED4",sub:["LC Citi","LC Chase","Carb Fl","Carb De","Nafy De","Nafy Fl"]},
};

const EMP = {
  C2:    {bg:"rgba(37,99,235,.15)",  border:"#2563EB",text:"#60A5FA"},
  Nafil: {bg:"rgba(5,150,105,.15)",  border:"#059669",text:"#34D399"},
  MB:    {bg:"rgba(234,88,12,.15)",  border:"#EA580C",text:"#FB923C"},
  CDM:   {bg:"rgba(219,39,119,.15)",  border:"#DB2777",text:"#F472B6"},
  LCK:   {bg:"rgba(124,58,237,.15)", border:"#7C3AED",text:"#A78BFA"},
};

// ── Estado global ─────────────────────────────────────────────
let state = {
  tab: "cargar",
  gastos: load("gastos_v5", []),
  categorias: load("cats_v5", CATEGORIAS_DEFAULT),
  plantillas: load("plants_v5", []),
  // form
  empresa: null, desc:"", titular:"", monto:"", moneda:"ARS", fecha:hoy(),
  medio:null, subMedio:null, categoria:"", nota:"",
  splitMode:false, splitParts:[{empresa:null,pct:50},{empresa:null,pct:50}],
  // ia
  empIA:null, textoLibre:"", iaLoading:false, iaResult:null,
  _iaTitular:undefined,
  imgB64:null, imgPreview:null,
  iaSplitMode:false, iaSplitParts:[{empresa:null,pct:50},{empresa:null,pct:50}],
  // voz
  vozActiva:false, vozStatus:"",
  // lista
  filtro:"Todos",
  // modales
  showCats:false, plantillaEnUso:null, sugerencia:null,
  // sync
  syncStatus:"idle",
  // drive
  driveToken: localStorage.getItem("drive_token") || null,
  driveTokenExpiry: parseInt(localStorage.getItem("drive_token_expiry") || "0"),
  driveRefreshToken: localStorage.getItem("drive_refresh_token") || null,
  driveFileId: localStorage.getItem("drive_file_id") || null,
  deletedIds: load("deleted_ids_v1", []),
  pendingSync: false,
};

function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
}

function saveAll() {
  localStorage.setItem("gastos_v5", JSON.stringify(state.gastos));
  localStorage.setItem("cats_v5", JSON.stringify(state.categorias));
  localStorage.setItem("plants_v5", JSON.stringify(state.plantillas));
  localStorage.setItem("local_modified", String(Date.now()));
  syncToDrive();
}

// ── Google Drive Sync ─────────────────────────────────────────
function driveEnabled() { return state.driveToken && DRIVE_CLIENT_ID; }

// Mergea gastos de Drive con los locales usando updatedAt y deletedIds (tombstones)
function mergeGastos(driveGastos, localGastos, driveDeletedIds, localDeletedIds) {
  const allDeletedIds = new Set([...(driveDeletedIds||[]), ...(localDeletedIds||[])]);
  const byId = new Map();
  (driveGastos||[]).forEach(g => byId.set(g.id, g));
  (localGastos||[]).forEach(g => {
    const existing = byId.get(g.id);
    if (!existing) { byId.set(g.id, g); return; }
    // El más reciente gana (por updatedAt, default 0)
    const localTime = g.updatedAt || g.id || 0;
    const driveTime = existing.updatedAt || existing.id || 0;
    if (localTime >= driveTime) byId.set(g.id, g);
  });
  // Remover los que están en deletedIds
  allDeletedIds.forEach(id => byId.delete(id));
  return { merged: Array.from(byId.values()), allDeletedIds: Array.from(allDeletedIds) };
}

async function fetchDriveData() {
  let fileId = state.driveFileId;
  if (!fileId) {
    const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}'+and+trashed=false&fields=files(id,name)`, {
      headers: { "Authorization": `Bearer ${state.driveToken}` }
    });
    if (search.status === 401) return { status: 401 };
    const searchData = await search.json();
    if (searchData.files && searchData.files.length > 0) {
      fileId = searchData.files[0].id;
      localStorage.setItem("drive_file_id", fileId);
      state.driveFileId = fileId;
    }
  }
  if (!fileId) return { status: 200, data: null };
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { "Authorization": `Bearer ${state.driveToken}` }
  });
  if (res.status === 401) return { status: 401 };
  if (!res.ok) return { status: res.status };
  const data = await res.json();
  return { status: 200, data, fileId };
}

async function uploadDriveData(data) {
  const content = JSON.stringify(data);
  let fileId = state.driveFileId;
  let res;
  if (fileId) {
    res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: content
    });
  } else {
    const meta = await fetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: "application/json" })
    });
    if (meta.status === 401) return { status: 401 };
    const metaData = await meta.json();
    fileId = metaData.id;
    res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: content
    });
    if (res.ok) {
      localStorage.setItem("drive_file_id", fileId);
      state.driveFileId = fileId;
    }
  }
  return { status: res.status, ok: res.ok };
}

async function syncToDrive() {
  if (!driveEnabled()) return;
  const ok = await ensureValidToken();
  if (!ok) { handleTokenExpired(); return; }
  setState({syncStatus:"syncing"}, false);
  try {
    // 1. Bajar lo que hay en Drive primero
    const fetched = await fetchDriveData();
    if (fetched.status === 401) { handleTokenExpired(); return; }
    if (fetched.status !== 200) throw new Error("HTTP " + fetched.status);
    const driveData = fetched.data || {};

    // 2. Mergear con lo local
    const { merged, allDeletedIds } = mergeGastos(driveData.gastos, state.gastos, driveData.deletedIds, state.deletedIds);
    state.gastos = merged;
    state.deletedIds = allDeletedIds;
    localStorage.setItem("gastos_v5", JSON.stringify(state.gastos));
    localStorage.setItem("deleted_ids_v1", JSON.stringify(state.deletedIds));

    // Categorías y plantillas: el más reciente en cantidad gana (simplificado)
    if (driveData.categorias && driveData.categorias.length > state.categorias.length) {
      state.categorias = driveData.categorias;
      localStorage.setItem("cats_v5", JSON.stringify(state.categorias));
    }
    if (driveData.plantillas && driveData.plantillas.length > state.plantillas.length) {
      state.plantillas = driveData.plantillas;
      localStorage.setItem("plants_v5", JSON.stringify(state.plantillas));
    }

    // 3. Subir el resultado mergeado
    const toUpload = {
      gastos: state.gastos,
      categorias: state.categorias,
      plantillas: state.plantillas,
      deletedIds: state.deletedIds,
      lastSync: new Date().toISOString()
    };
    const uploaded = await uploadDriveData(toUpload);
    if (uploaded.status === 401) { handleTokenExpired(); return; }
    if (!uploaded.ok) throw new Error("HTTP " + uploaded.status);

    localStorage.removeItem("pending_sync");
    setState({syncStatus:"ok"});
    setTimeout(()=>{ if(state.syncStatus==="ok") setState({syncStatus:"idle"}, false); }, 3000);
  } catch(e) {
    console.error("Drive sync error:", e);
    setState({syncStatus:"error"}, false);
    localStorage.setItem("pending_sync", "1");
  }
}

async function handleTokenExpired() {
  const refreshed = await refreshDriveToken();
  if (refreshed) {
    syncToDrive();
    return;
  }
  state.driveToken = null;
  localStorage.removeItem("drive_token");
  setState({syncStatus:"expired"});
  showToast("⚠ Sesión de Drive vencida, reconectá");
}

async function loadFromDrive() {
  // El merge se hace en syncToDrive, que baja, mergea y sube
  await syncToDrive();
  render();
}

function driveLogin() {
  if (!DRIVE_CLIENT_ID) { showToast("⚠ Configurá el Client ID de Google"); return; }
  const scope = encodeURIComponent("https://www.googleapis.com/auth/drive.file");
  const origin = window.location.origin + window.location.pathname.replace(/\/+$/, '');
  const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${DRIVE_CLIENT_ID}&redirect_uri=${encodeURIComponent(origin)}&response_type=code&access_type=offline&prompt=consent&scope=${scope}`;
  window.location.href = url;
}

function driveLogout() {
  state.driveToken = null;
  state.driveRefreshToken = null;
  state.driveTokenExpiry = 0;
  state.driveFileId = null;
  localStorage.removeItem("drive_token");
  localStorage.removeItem("drive_token_expiry");
  localStorage.removeItem("drive_refresh_token");
  localStorage.removeItem("drive_file_id");
  setState({syncStatus:"idle"});
  showToast("Drive desconectado");
}

async function handleOAuthCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (!code) return;
  const origin = window.location.origin + window.location.pathname.replace(/\/+$/, '');
  window.history.replaceState(null, "", window.location.pathname);
  try {
    const res = await fetch("/auth/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, redirect_uri: origin })
    });
    const data = await res.json();
    if (data.access_token) {
      state.driveToken = data.access_token;
      state.driveTokenExpiry = Date.now() + (data.expires_in || 3600) * 1000;
      localStorage.setItem("drive_token", data.access_token);
      localStorage.setItem("drive_token_expiry", String(state.driveTokenExpiry));
      if (data.refresh_token) {
        state.driveRefreshToken = data.refresh_token;
        localStorage.setItem("drive_refresh_token", data.refresh_token);
      }
      showToast("✓ Drive conectado");
      render();
      loadFromDrive();
    } else {
      showToast("Error conectando Drive: " + (data.error || "desconocido"));
    }
  } catch(e) {
    console.error("OAuth callback error:", e);
    showToast("Error conectando Drive");
  }
}

async function refreshDriveToken() {
  if (!state.driveRefreshToken) return false;
  try {
    const res = await fetch("/auth/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ grant_type: "refresh_token", refresh_token: state.driveRefreshToken })
    });
    const data = await res.json();
    if (data.access_token) {
      state.driveToken = data.access_token;
      state.driveTokenExpiry = Date.now() + (data.expires_in || 3600) * 1000;
      localStorage.setItem("drive_token", data.access_token);
      localStorage.setItem("drive_token_expiry", String(state.driveTokenExpiry));
      return true;
    }
  } catch(e) {
    console.error("Refresh token error:", e);
  }
  return false;
}

async function ensureValidToken() {
  // Renovar si falta menos de 5 min para expirar
  if (state.driveToken && state.driveTokenExpiry && Date.now() < state.driveTokenExpiry - 5*60*1000) {
    return true;
  }
  return await refreshDriveToken();
}

function hoy() { return new Date().toISOString().split("T")[0]; }

function fmtMonto(n, m) {
  const sym = m==="U$S"?"U$S ":m==="Euros"?"€":m==="CLP"?"CLP ":"$";
  return sym + Number(n).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0});
}

function medioStr(m, sm) { return m?(sm?`${m} · ${sm}`:m):null; }

function splitSum(parts) { return parts.reduce((s,p)=>s+(parseFloat(p.pct)||0),0); }

function detectarFrecuentes() {
  const count={};
  state.gastos.forEach(g=>{
    const k=`${g.empresa}||${(g.desc||"").toLowerCase().trim()}`;
    if(!count[k]) count[k]={n:0,sample:g};
    count[k].n++;
  });
  return Object.values(count).filter(v=>v.n>=2).map(v=>v.sample);
}

// Toast
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2400);
}

// ── Re-render ─────────────────────────────────────────────────
function setState(updates, doRender=true) {
  Object.assign(state, updates);
  if (doRender) render();
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = buildApp();
  attachEvents();
}

// ── HTML builders ─────────────────────────────────────────────

function buildApp() {
  return `
    ${buildHeader()}
    ${buildTabs()}
    ${state.tab==="cargar"   ? buildCargar()    : ""}
    ${state.tab==="ia"       ? buildIA()        : ""}
    ${state.tab==="frecuentes"? buildFrecuentes(): ""}
    ${state.tab==="lista"    ? buildLista()     : ""}
    ${state.tab==="resumen"  ? buildResumen()   : ""}
    ${state.showCats         ? buildModalCats() : ""}
    ${state.plantillaEnUso   ? buildModalPlantilla() : ""}
    ${state.gastoEditando    ? buildModalEditarGasto() : ""}
  `;
}

function buildHeader() {
  let driveIndicator;
  if (!state.driveToken) {
    driveIndicator = `<button onclick="driveLogin()" style="background:none;border:1px solid #34D399;border-radius:6px;color:#34D399;font-size:11px;font-family:monospace;padding:3px 8px;cursor:pointer">+ Drive</button>`;
  } else if (state.syncStatus === "syncing") {
    driveIndicator = `<span style="color:#F59E0B;font-family:monospace;font-size:11px;display:inline-flex;align-items:center;gap:4px"><span style="animation:spin 1s linear infinite;display:inline-block">⟳</span> Sincronizando</span>`;
  } else if (state.syncStatus === "error") {

function buildTabs() {
  const tabs = [["cargar","＋ Cargar"],["ia","✦ IA"],["frecuentes","★ Frec."],["lista","≡ Gastos"],["resumen","◈ Total"]];
  return `<div class="tabs">${tabs.map(([id,label])=>`<button class="tab${state.tab===id?" active":""}" onclick="setTab('${id}')">${label}</button>`).join("")}</div>`;
}

function buildEmpGrid(sel, onclickFn) {
  return `<div class="emp-grid">${EMPRESAS.map(e=>{
    const active=sel===e, c=EMP[e];
    return `<button onclick="${onclickFn}('${e}')" style="padding:10px 8px;border-radius:8px;border:2px solid ${active?c.border:"var(--border)"};background:${active?c.bg:"transparent"};color:${active?c.text:"var(--muted)"};font-family:monospace;font-size:12px;font-weight:500">${e}</button>`;
  }).join("")}</div>`;
}

function buildMedioPicker(medio, subMedio, setFn, setSubFn) {
  const tipos = Object.keys(MEDIOS).sort((a,b)=>a.localeCompare(b)).map(k=>{
    const active=medio===k, c=MEDIOS[k].color;
    return `<button class="medio-tipo-btn" onclick="${setFn}('${k}')" style="border-color:${active?c:"var(--border)"};background:${active?c+"22":"transparent"};color:${active?c:"var(--muted)"};font-weight:${active?600:400}">${k}</button>`;
  }).join("");
  const subs = medio ? `<div class="medio-subs">${[...MEDIOS[medio].sub].sort((a,b)=>a.localeCompare(b)).map(s=>{
    const active=subMedio===s, c=MEDIOS[medio].color;
    return `<button class="medio-sub-btn" onclick="${setSubFn}('${s}')" style="border-color:${active?c:"var(--border)"};background:${active?c+"22":"transparent"};color:${active?c:"var(--muted)"}">${s}</button>`;
  }).join("")}</div>` : "";
  return `<div class="medio-tipos">${tipos}</div>${subs}`;
}

function buildSplitEditor(parts, updateFn, addFn, eqFn) {
  const total = splitSum(parts);
  const rows = parts.map((p,i)=>`
    <div class="split-row">
      <select style="flex:2" onchange="${updateFn}(${i},'empresa',this.value)">
        <option value="">Empresa...</option>
        ${EMPRESAS.map(e=>`<option value="${e}"${p.empresa===e?" selected":""}>${e}</option>`).join("")}
      </select>
      <div class="pct-wrap">
        <input type="number" min="0" max="100" value="${p.pct}" oninput="${updateFn}(${i},'pct',parseFloat(this.value)||0)">
        <span class="pct-sym">%</span>
      </div>
      ${parts.length>2?`<button class="btn-icon" onclick="removeSplitPart_${addFn.replace(/[^a-z]/gi,'')}(${i})">✕</button>`:""}
    </div>
  `).join("");
  return `${rows}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
      <button onclick="${addFn}()" style="background:none;border:1px dashed var(--border);border-radius:6px;color:var(--muted);font-size:12px;padding:4px 10px">+ empresa</button>
      <span style="font-family:monospace;font-size:12px;color:${total===100?"#34D399":"#EF4444"}">Total: ${total}%</span>
    </div>
    <button onclick="${eqFn}()" style="margin-top:8px;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline">Partes iguales</button>`;
}

  const items = sorted.length ? sorted.map(g=>`
    <div class="gasto-item">
      <div class="dot" style="background:${EMP[g.empresa]?.border||"#666"}"></div>

        <div class="gasto-meta">${g.fecha.split("-").reverse().join("/")} · ${g.empresa} · ${g.medio||"—"}${g.titular?" · "+esc(g.desc):""}</div>

function buildResumen() {
  const MONEDAS = ["ARS","U$S","Euros","CLP"];
  const cards = EMPRESAS.map(e=>{
    const eg = state.gastos.filter(g=>g.empresa===e);
    const c = EMP[e];
    const totalesPorMoneda = MONEDAS.map(mon=>{
      const t = eg.filter(g=>(g.moneda||"ARS")===mon).reduce((s,g)=>s+g.monto,0);
      return t > 0 ? `<div style="font-family:monospace;font-size:14px;font-weight:500;color:${c.text}">${fmtMonto(t,mon)}</div>` : "";
    }).filter(Boolean).join("");

function onDescChange(v) {
  state.desc = v;
  // Sugerencia automática - sin re-render para no perder foco
  let sug = null;
  if (v.length >= 3) {
    const key = v.toLowerCase().trim();
    sug = state.gastos.find(g => g.desc && (g.desc.toLowerCase().includes(key) || key.includes(g.desc.toLowerCase().trim().slice(0,4))));
    if (sug && sug.desc.toLowerCase() === v.toLowerCase()) sug = null;
  }
  const prevSug = state.sugerencia;
  state.sugerencia = sug;
  // Solo re-render si cambió la sugerencia, y restaurar foco después
  if ((prevSug && prevSug.id) !== (sug && sug.id)) {
    const el = document.getElementById("inp-desc");
    const pos = el ? el.selectionStart : null;
    render();
    const el2 = document.getElementById("inp-desc");
    if (el2) { el2.focus(); if (pos !== null) { try { el2.setSelectionRange(pos, pos); } catch(e){} } }
  }
}

// IA
async function procesarIA() {
  if(!state.imgB64&&!state.textoLibre.trim()) return showToast("⚠ Subí imagen o escribí algo");
  if(!state.iaSplitMode&&!state.empIA) return showToast("⚠ Seleccioná empresa");
  setState({iaLoading:true,iaResult:null});
  try {
    const prompt = (state.textoLibre?`Texto: "${state.textoLibre}". `:"") + `Extraé: titular (nombre del comercio/proveedor), desc (concepto del gasto), monto (número), moneda (ARS/U$S/Euros/CLP), fecha (YYYY-MM-DD o null), medio (Tx/TC ARS/TC U$S/TC EUR/Cash/MP/PayPal/Bizum/Zelle), subMedio (o null), categoria (una de: ${state.categorias.join("/")}). Solo JSON sin backticks.`;
    let messages;
    if(state.imgB64) {
      messages=[{role:"user",content:[{type:"image",source:{type:"base64",media_type:state.imgMime||"image/jpeg",data:state.imgB64}},{type:"text",text:prompt}]}];
    } else {
      messages=[{role:"user",content:`Del texto: "${state.textoLibre.trim()}". ${prompt}`}];
    }
    const res = await fetch("/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:ANTHROPIC_MODEL,max_tokens:500,messages})});
    const data = await res.json();
    if (!data.content) { const errDetail = data.error ? data.error.message || JSON.stringify(data.error) : JSON.stringify(data); throw new Error(errDetail); } const raw = data.content.map(c=>c.text||"").join("").trim();
    const clean = raw.replace(/```json|```/g,"").trim();
    // Try direct parse first, then extract JSON object
    let parsed;
    try {
      parsed = JSON.parse(clean);
    } catch(e1) {
      const jm = clean.match(/\{[\s\S]*\}/);
      if (!jm) throw new Error("Sin JSON: " + clean.slice(0,100));
      try { parsed = JSON.parse(jm[0]); }
      catch(e2) { throw new Error("JSON invalido: " + jm[0].slice(0,100)); }
    }
    setState({iaResult:parsed,iaLoading:false});
  } catch(e) { const errMsg = e.message; console.error('IA Error:', errMsg); showToast("Error IA: "+errMsg); setState({iaLoading:false}); }
}

function exportarExcel() {
  if(!state.gastos.length) return showToast("No hay gastos para exportar");
  const wb = XLSX.utils.book_new();
  const headers = ["Fecha","Empresa","Titular/Comercio","Descripción","Categoría","Medio de pago","Moneda","Monto","Nota"];
  EMPRESAS.forEach(emp=>{
    const rows=state.gastos.filter(g=>g.empresa===emp).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(g=>[g.fecha,g.empresa,g.titular||"",g.desc,g.categoria,g.medio,g.moneda||"ARS",g.monto,g.nota||""]);
    const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
    ws["!cols"]=[12,10,22,30,18,22,8,12,25].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws,emp);
  });
  const allRows=[...state.gastos].sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(g=>[g.fecha,g.empresa,g.titular||"",g.desc,g.categoria,g.medio,g.moneda||"ARS",g.monto,g.nota||""]);
  const wsAll=XLSX.utils.aoa_to_sheet([headers,...allRows]);
  wsAll["!cols"]=[12,10,22,30,18,22,8,12,25].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,wsAll,"Todos");
  XLSX.writeFile(wb,`gastos_${hoy()}.xlsx`);
  showToast("✓ Excel exportado");
}

// ── Init ──────────────────────────────────────────────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch(e => console.error("SW error:", e));
  });
}
handleOAuthCallback();
render();
if (driveEnabled()) loadFromDrive();
// Sync periódico cada 2 minutos si hay conexión activa con Drive
setInterval(() => {
  if (driveEnabled() && state.syncStatus !== "syncing") loadFromDrive();
}, 2 * 60 * 1000);
// Sync al volver a la pestaña/app (visibilitychange)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && driveEnabled() && state.syncStatus !== "syncing") {
    loadFromDrive();
  }
});
</script>
</body>
</html>
