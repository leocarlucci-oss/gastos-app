<script>
// ── Datos ─────────────────────────────────────────────────────
const EMPRESAS = ["C2","LCK","AKC","CDM","NAFIL","MB","FABIANA"];
const ANTHROPIC_MODEL = "claude-sonnet-4-5";
const DRIVE_FILE_NAME = "gastos_app_data.json";
const DRIVE_CLIENT_ID = "1051749004626-0h5d41e0uq148uq2srrvvfu3p1f9cckk.apps.googleusercontent.com";
const DRIVE_FOLDER_ID = "1SdZkk9-yMr8KXjUTFwgoxFbl62tiAYd2"; // Carpeta "Gastos_App" en Drive

const CATEGORIAS_DEFAULT = ["Combustible","Alimentación","Equipamiento","Mantenimiento","Transporte","Servicios","Honorarios","Marketing","Insumos","Otros"];

const MEDIOS = {

  "E-cheque":{color:"#10B981",sub:["Santander BW","Santander NF","Santander LC","Galicia C2","Galicia BW","Galicia LC","Supervielle C2","Supervielle LC","BBVA AK","BBVA LC","CIU AK","CIU BW","CIU NF","Macro LC"]},
};

const EMP = {
  FABIANA: {bg:"rgba(6,182,212,.15)",  border:"#0891B2",text:"#22D3EE"},
  C2:    {bg:"rgba(37,99,235,.15)",  border:"#2563EB",text:"#60A5FA"},
  NAFIL: {bg:"rgba(5,150,105,.15)",  border:"#059669",text:"#34D399"},
  MB:    {bg:"rgba(234,88,12,.15)",  border:"#EA580C",text:"#FB923C"},
  CDM:   {bg:"rgba(219,39,119,.15)",  border:"#DB2777",text:"#F472B6"},
  LCK:   {bg:"rgba(124,58,237,.15)", border:"#7C3AED",text:"#A78BFA"},
  AKC:   {bg:"rgba(234,179,8,.15)",   border:"#CA8A04",text:"#FDE047"},
};

// ── Modo viaje: defaults temporales hasta el 25/07/2026 ──────
function enModoViaje(){ return hoy() <= "2026-07-25"; }
function defaultMoneda(){ return enModoViaje() ? "Euros" : "ARS"; }
function defaultMedio(){ return enModoViaje() ? "TC EUR" : null; }
function defaultSplitParts(){ return enModoViaje() ? [{empresa:"CDM",pct:66},{empresa:"LCK",pct:34}] : [{empresa:null,pct:50},{empresa:null,pct:50}]; }
function enModoGBP(){ return new Date() <= new Date("2026-07-23T14:00:00"); }
function enModoCatEuropa(){ return new Date() <= new Date("2026-07-23T23:59:59"); }
function normCatName(s) { const t = String(s||"").trim(); return t ? t.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ") : t; }
function defaultCategoriaSel(){ return enModoCatEuropa() ? [normCatName("EUROPA JUL26")] : []; }

// ── Estado global ─────────────────────────────────────────────
let state = {
  tab: "cargar",
  gastos: sanearIds(load("gastos_v5", [])),
  categorias: load("cats_v5", CATEGORIAS_DEFAULT),
  catsProyecto: load("cats_proyecto_v1", []),
  catsArchivadas: load("cats_archivadas_v1", []),
  deletedCategorias: load("deleted_cats_v1", []),
  // form
  empresa: null, desc:"", titular:"", monto:"", moneda:defaultMoneda(), fecha:hoy(), hora:horaAhora(),
  medio:defaultMedio(), subMedio:null, categoriasSel:defaultCategoriaSel(), nota:"", cantCuotas:"", tcCuotas:false, pagador:null, gbpMode:false, gbpRate: (localStorage.getItem("gbp_rate_manual")?parseFloat(localStorage.getItem("gbp_rate")):0)||1.24,
  cantidad:"", precioUnit:"", _cantPrecioAbierta:false,
  splitMode:false, splitParts:defaultSplitParts(),
  // ia
  empIA:null, textoLibre:"", iaLoading:false, iaResult:null,
  _iaTitular:undefined,
  imgB64:null, imgPreview:null,
  iaSplitMode:false, iaSplitParts:defaultSplitParts(),
  // voz
  vozActiva:false, vozStatus:"",
  // lista
  filtro:"Todos",
  busqueda:"", filtroBEmp:"", filtroBCats:[], filtroBCatsExcl:[], filtroBMedio:"", filtroBMoneda:"", filtroMontoMin:"", filtroMontoMax:"", filtroBPagador:"", filtroDesde:"", filtroHasta:"",
  exportDesde:"", exportHasta:"",
  // modales
  showCats:false, gastoViendo:null, listPage:1,
  // sync
  syncStatus:"idle", isOffline:!navigator.onLine,
  // drive
  driveToken: localStorage.getItem("drive_token") || null,
  driveTokenExpiry: parseInt(localStorage.getItem("drive_token_expiry") || "0"),
  driveRefreshToken: localStorage.getItem("drive_refresh_token") || null,
  driveFileId: localStorage.getItem("drive_file_id") || null,
  deletedIds: load("deleted_ids_v1", []),
  pendingSync: false,
};

function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
}

function sanearIds(gastos) {
  let modified = false;
  let autoId = Date.now();
  const seen = new Set();
  const result = gastos.map(g => {
    if (!g.id || seen.has(String(g.id))) {
      g = { ...g, id: autoId++ };
      modified = true;
    }
    seen.add(String(g.id));
    return g;
  });
  if (modified) {
    localStorage.setItem("gastos_v5", JSON.stringify(result));
  }
  return result;
}

function saveAll() {
  localStorage.setItem("gastos_v5", JSON.stringify(state.gastos));
  localStorage.setItem("cats_v5", JSON.stringify(state.categorias));
  localStorage.setItem("cats_proyecto_v1", JSON.stringify(state.catsProyecto));
  localStorage.setItem("cats_archivadas_v1", JSON.stringify(state.catsArchivadas));
  localStorage.setItem("local_modified", String(Date.now()));
  syncToDrive();
}

// Migración one-off: agrega "Traslados BsAs" a todo gasto con titular "Jetsmart Airlines"
function migrarCatJetsmartTraslados() {
  const FLAG = "migrated_jetsmart_traslados_bsas_v1";
  if (localStorage.getItem(FLAG)) return;
  const TITULAR_MATCH = "jetsmart airlines";
  const CAT = "Traslados BsAs";
  let count = 0;
  state.gastos = state.gastos.map(g => {
    if ((g.titular||"").trim().toLowerCase() !== TITULAR_MATCH) return g;
    const cats = getCats(g);
    if (cats.includes(CAT)) return g;
    count++;
    return {...g, categorias:[...cats, CAT], updatedAt: Date.now()};
  });
  if (!state.categorias.includes(CAT)) state.categorias = [...state.categorias, CAT];
  localStorage.setItem(FLAG, "1");
  if (count > 0) {
    saveAll();
    render();
    showToast(`✓ "${CAT}" agregada a ${count} gasto${count>1?"s":""} de Jetsmart Airlines`);
  } else {
    saveAll();
  }
}

// Migración one-off: estandariza el casing de todas las categorías (Primera mayúscula por palabra)
function normalizarCasingCategorias() {
  const FLAG = "migrated_cat_casing_v3";
  if (localStorage.getItem(FLAG)) return;
  const nuevas = [];
  const vistos = new Set();
  const viejosATombstone = [];
  let changed = false;
  state.categorias.forEach(c => {
    const n = normCatName(c);
    if (c !== n) { changed = true; viejosATombstone.push(c); }
    if (!vistos.has(n)) { vistos.add(n); nuevas.push(n); }
  });
  if (changed) {
    state.categorias.forEach(c => {
      const n = normCatName(c);
      if (c !== n) replaceCatInGastos(c, n);
    });
    state.categorias = nuevas;
    // Tombstone de los nombres viejos para que un sync con Drive no los vuelva a traer duplicados
    state.deletedCategorias = [...new Set([...state.deletedCategorias, ...viejosATombstone])].filter(c => !nuevas.includes(c));
    localStorage.setItem("deleted_cats_v1", JSON.stringify(state.deletedCategorias));
    saveAll();
    render();
  }
  localStorage.setItem(FLAG, "1");
}

// Normaliza el casing de las categorías guardadas EN LOS GASTOS (no solo en la lista)
// y registra en la lista las que falten. Arregla importaciones viejas que guardaron
// nombres crudos del Excel (ej "EUROPA JUL26" en vez de "Europa Jul26").
function normalizarCategoriasDeGastos() {
  const FLAG = "migrated_gasto_cats_v1";
  if (localStorage.getItem(FLAG)) return;
  let changed = false;
  state.gastos = state.gastos.map(g => {
    const cats = getCats(g);
    if (!cats.length) return g;
    const norm = [];
    cats.forEach(c => { const n = (String(c).trim().toLowerCase() === "sin categoría") ? "Sin categoría" : normCatName(c); if (n && !norm.includes(n)) norm.push(n); });
    if (norm.length === cats.length && norm.every((n,i) => n === cats[i])) return g;
    changed = true;
    return {...g, categorias: norm, updatedAt: Date.now()};
  });
  const faltantes = [];
  state.gastos.forEach(g => getCats(g).forEach(c => {
    if (c && c !== "Sin categoría" && !state.categorias.includes(c) && !faltantes.includes(c)) faltantes.push(c);
  }));
  if (faltantes.length) {
    changed = true;
    state.categorias = [...state.categorias, ...faltantes];
    if (Array.isArray(state.deletedCategorias) && state.deletedCategorias.length) {
      state.deletedCategorias = state.deletedCategorias.filter(c => !faltantes.includes(c));
      localStorage.setItem("deleted_cats_v1", JSON.stringify(state.deletedCategorias));
    }
    console.log("Categorías recuperadas desde los gastos:", faltantes);
  }
  if (changed) { saveAll(); render(); }
  localStorage.setItem(FLAG, "1");
}

// ── Google Drive Sync ─────────────────────────────────────────
function driveEnabled() { return state.driveToken && DRIVE_CLIENT_ID; }

// Mergea gastos de Drive con los locales usando updatedAt y deletedIds (tombstones)
function mergeGastos(driveGastos, localGastos, driveDeletedIds, localDeletedIds) {
  const allDeletedIds = new Set([...(driveDeletedIds||[]), ...(localDeletedIds||[])].map(String));
  const byId = new Map();
  let autoId = Date.now();
  // Procesar gastos de Drive primero
  (driveGastos||[]).forEach(g => {
    if (g.id === undefined || g.id === null) g.id = autoId++;
    const key = String(g.id);
    if (!allDeletedIds.has(key)) byId.set(key, g);
  });
  // Merge con locales
  (localGastos||[]).forEach(g => {
    if (g.id === undefined || g.id === null) g.id = autoId++;
    const key = String(g.id);
    if (allDeletedIds.has(key)) return;
    const existing = byId.get(key);
    if (!existing) { byId.set(key, g); return; }
    const localTime = g.updatedAt || 0;
    const driveTime = existing.updatedAt || 0;
    if (localTime >= driveTime) byId.set(key, g);
  });
  return { merged: Array.from(byId.values()), allDeletedIds: Array.from(allDeletedIds) };
}

async function moverArchivoACarpeta(fileId, folderId) {
  try {
    const meta = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=parents`, {
      headers: { "Authorization": `Bearer ${state.driveToken}` }
    });
    if (!meta.ok) return;
    const { parents } = await meta.json();
    if (parents && parents.includes(folderId)) return; // ya está en la carpeta correcta
    const removeParents = (parents || []).join(",");
    const url = `https://www.googleapis.com/drive/v3/files/${fileId}?addParents=${folderId}` + (removeParents ? `&removeParents=${removeParents}` : "");
    await fetch(url, { method: "PATCH", headers: { "Authorization": `Bearer ${state.driveToken}` } });
  } catch (e) {
    console.warn("No se pudo mover archivo a la carpeta de la app:", e);
  }
}

async function migrarArchivosSueltos(folderId) {
  try {
    if (state.driveFileId) await moverArchivoACarpeta(state.driveFileId, folderId);
    const search = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=name+contains+'gastos_app_backup_'+and+trashed=false&fields=files(id,name,parents)`,
      { headers: { "Authorization": `Bearer ${state.driveToken}` } }
    );
    if (search.ok) {
      const { files } = await search.json();
      for (const f of (files || [])) {
        if (!f.parents || !f.parents.includes(folderId)) {
          await moverArchivoACarpeta(f.id, folderId);
        }
      }
    }
  } catch (e) {
    console.warn("Migración de archivos sueltos falló (no crítico):", e);
  }
}

async function ensureDriveFolder() {
  let folderId = localStorage.getItem("drive_app_folder_id");
  if (!folderId) {
    try {
      const search = await fetch(
        `https://www.googleapis.com/drive/v3/files?q=name='Gastos_App'+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false&fields=files(id,name)`,
        { headers: { "Authorization": `Bearer ${state.driveToken}` } }
      );
      if (search.ok) {
        const { files } = await search.json();
        if (files && files.length > 0) folderId = files[0].id;
      }
      if (!folderId) {
        const create = await fetch("https://www.googleapis.com/drive/v3/files", {
          method: "POST",
          headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
          body: JSON.stringify({ name: "Gastos_App", mimeType: "application/vnd.google-apps.folder" })
        });
        if (create.ok) {
          const data = await create.json();
          folderId = data.id;
        }
      }
      if (folderId) localStorage.setItem("drive_app_folder_id", folderId);
    } catch (e) {
      console.warn("No se pudo resolver la carpeta de Drive de la app:", e);
    }
  }
  if (!folderId) folderId = DRIVE_FOLDER_ID; // fallback si todo falló

  if (folderId !== DRIVE_FOLDER_ID && !localStorage.getItem("drive_migrated_v1")) {
    await migrarArchivosSueltos(folderId);
    localStorage.setItem("drive_migrated_v1", "1");
  }
  return folderId;
}

async function fetchDriveData() {
  let fileId = state.driveFileId;
  if (!fileId) {
    const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}'+and+trashed=false&fields=files(id,name)`, {
      headers: { "Authorization": `Bearer ${state.driveToken}` }
    });
    if (search.status === 401) return { status: 401 };
    const searchData = await search.json();
    if (searchData.files && searchData.files.length > 0) {
      fileId = searchData.files[0].id;
      localStorage.setItem("drive_file_id", fileId);
      state.driveFileId = fileId;
    }
  }
  if (!fileId) return { status: 200, data: null };
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { "Authorization": `Bearer ${state.driveToken}` }
  });
  if (res.status === 401) return { status: 401 };
  if (!res.ok) return { status: res.status };
  const data = await res.json();
  return { status: 200, data, fileId };
}

async function uploadDriveData(data) {
  const content = JSON.stringify(data);
  let fileId = state.driveFileId;
  let res;
  if (fileId) {
    res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: content
    });
  } else {
    const folderId = await ensureDriveFolder();
    const meta = await fetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: "application/json", parents: [folderId] })
    });
    if (meta.status === 401) return { status: 401 };
    const metaData = await meta.json();
    fileId = metaData.id;
    res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: content
    });
    if (res.ok) {
      localStorage.setItem("drive_file_id", fileId);
      state.driveFileId = fileId;
    }
  }
  return { status: res.status, ok: res.ok };
}

async function hacerBackupDiario(data) {
  try {
    const hoyStr = new Date().toISOString().split("T")[0]; // YYYY-MM-DD
    const lastBackup = localStorage.getItem("last_backup_date");
    if (lastBackup === hoyStr) return; // Ya se hizo el backup hoy

    const backupName = `gastos_app_backup_${hoyStr}.json`;
    const content = JSON.stringify({ ...data, backupDate: hoyStr });

    // Crear el archivo de backup del día
    const folderId = await ensureDriveFolder();
    const meta = await fetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ name: backupName, mimeType: "application/json", parents: [folderId] })
    });
    if (!meta.ok) return;
    const metaData = await meta.json();
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${metaData.id}?uploadType=media`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: content
    });

    localStorage.setItem("last_backup_date", hoyStr);

    // Limpiar backups con más de 30 días
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 10);
    const cutoffStr = cutoff.toISOString().split("T")[0];
    const search = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=name+contains+'gastos_app_backup_'+and+trashed=false&fields=files(id,name)`,
      { headers: { "Authorization": `Bearer ${state.driveToken}` } }
    );
    if (search.ok) {
      const { files } = await search.json();
      for (const f of (files || [])) {
        const match = f.name.match(/gastos_app_backup_(\d{4}-\d{2}-\d{2})\.json/);
        if (match && match[1] < cutoffStr) {
          await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${state.driveToken}` }
          });
        }
      }
    }
  } catch(e) {
    console.warn("Backup diario falló (no crítico):", e);
  }
}

async function syncToDrive() {
  if (!navigator.onLine) {
    localStorage.setItem("pending_sync", "1");
    setState({syncStatus:"error"}, false);
    return;
  }
  if (!driveEnabled()) return;
  const ok = await ensureValidToken();
  if (!ok) { handleTokenExpired(); return; }
  setState({syncStatus:"syncing"}, false);
  try {
    // 1. Bajar lo que hay en Drive primero
    const fetched = await fetchDriveData();
    if (fetched.status === 401) { handleTokenExpired(); return; }
    if (fetched.status !== 200) throw new Error("HTTP " + fetched.status);
    const driveData = fetched.data || {};

    // 2. Mergear con lo local
    // Guardia: si Drive devuelve 0 gastos pero tenemos datos locales, es sospechoso — no tocar Drive
    const driveGastosRaw = driveData.gastos;
    if (Array.isArray(driveGastosRaw) && driveGastosRaw.length === 0 && state.gastos.length > 0) {
      console.warn("Drive devolvió 0 gastos pero hay " + state.gastos.length + " locales — sync abortado por seguridad");
      setState({syncStatus:"error"}, false);
      localStorage.setItem("pending_sync", "1");
      return;
    }
    const { merged, allDeletedIds } = mergeGastos(driveGastosRaw, state.gastos, driveData.deletedIds, state.deletedIds);
    state.gastos = merged;
    state.deletedIds = allDeletedIds;
    localStorage.setItem("gastos_v5", JSON.stringify(state.gastos));
    localStorage.setItem("deleted_ids_v1", JSON.stringify(state.deletedIds));

    // Categorías: merge respetando eliminadas localmente
    {
      const driveDeletedCats = driveData.deletedCategorias || [];
      const allDeletedCats = [...new Set([...state.deletedCategorias, ...driveDeletedCats])];
      state.deletedCategorias = allDeletedCats;
      localStorage.setItem("deleted_cats_v1", JSON.stringify(allDeletedCats));

      const driveCats = (driveData.categorias || []).filter(c => !allDeletedCats.includes(c));
      const localCats = state.categorias.filter(c => !allDeletedCats.includes(c));
      // Si el usuario reordenó localmente después del último sync de Drive, respetar orden local
      const driveLastSync = driveData.lastSync ? new Date(driveData.lastSync).getTime() : 0;
      const localReorderedAt = parseInt(localStorage.getItem("cats_reordered_at") || "0");
      const localIsNewer = localReorderedAt > driveLastSync;
      const mergedCats = localIsNewer
        ? [...new Set([...localCats, ...driveCats])]   // local gana (reorden manual reciente)
        : [...new Set([...driveCats, ...localCats])];  // drive gana (sync desde otro dispositivo)
      state.categorias = mergedCats;
      localStorage.setItem("cats_v5", JSON.stringify(state.categorias));

      // Marca de "proyecto": si se modificó localmente después del último sync, local gana
      // (evita que un toggle recién hecho se pise con la unión de lo que todavía está en Drive)
      const driveProy = driveData.catsProyecto || [];
      const localProyModifiedAt = parseInt(localStorage.getItem("cats_proyecto_modified_at") || "0");
      const localProyIsNewer = localProyModifiedAt > driveLastSync;
      state.catsProyecto = (localProyIsNewer
        ? (state.catsProyecto || [])
        : [...new Set([...(state.catsProyecto||[]), ...driveProy])])
        .filter(c => !allDeletedCats.includes(c) && mergedCats.includes(c));
      localStorage.setItem("cats_proyecto_v1", JSON.stringify(state.catsProyecto));

      // Archivadas: mismo patrón — si se modificó localmente después del último sync, local gana
      const driveArch = driveData.catsArchivadas || [];
      const localArchModifiedAt = parseInt(localStorage.getItem("cats_archivadas_modified_at") || "0");
      const localArchIsNewer = localArchModifiedAt > driveLastSync;
      state.catsArchivadas = (localArchIsNewer
        ? (state.catsArchivadas || [])
        : [...new Set([...(state.catsArchivadas||[]), ...driveArch])])
        .filter(c => !allDeletedCats.includes(c) && mergedCats.includes(c));
      localStorage.setItem("cats_archivadas_v1", JSON.stringify(state.catsArchivadas));
    }

    // 3. Backup diario y subir el resultado mergeado
    const toUpload = {
      gastos: state.gastos,
      categorias: state.categorias,
      catsProyecto: state.catsProyecto,
      catsArchivadas: state.catsArchivadas,
      deletedIds: state.deletedIds,
      deletedCategorias: state.deletedCategorias,
      lastSync: new Date().toISOString()
    };
    await hacerBackupDiario(toUpload);
    const uploaded = await uploadDriveData(toUpload);
    if (uploaded.status === 401) { handleTokenExpired(); return; }
    if (!uploaded.ok) throw new Error("HTTP " + uploaded.status);

    localStorage.removeItem("pending_sync");
    setState({syncStatus:"ok"});
    setTimeout(()=>{ if(state.syncStatus==="ok") setState({syncStatus:"idle"}, false); }, 3000);
  } catch(e) {
    console.error("Drive sync error:", e);
    setState({syncStatus:"error"}, false);
    localStorage.setItem("pending_sync", "1");
  }
}

async function handleTokenExpired() {
  const refreshed = await refreshDriveToken();
  if (refreshed) {
    syncToDrive();
    return;
  }
  // Refresh token inválido (puede haber expirado por modo Testing de Google)
  // Limpiarlo para que el próximo login pida consent y obtenga uno nuevo
  state.driveToken = null;
  state.driveRefreshToken = null;
  state.driveTokenExpiry = 0;
  localStorage.removeItem("drive_token");
  localStorage.removeItem("drive_token_expiry");
  localStorage.removeItem("drive_refresh_token");
  setState({syncStatus:"expired"});
  showToast("⚠ Sesión de Drive vencida — tocá Reconectar");
}

async function loadFromDrive() {
  // El merge se hace en syncToDrive, que baja, mergea y sube
  await syncToDrive();
  render();
}

function driveLogin() {
  if (!DRIVE_CLIENT_ID) { showToast("⚠ Configurá el Client ID de Google"); return; }
  const scope = encodeURIComponent("https://www.googleapis.com/auth/drive.file");
  const origin = window.location.origin + window.location.pathname.replace(/\/+$/, '');
  // prompt=consent solo la primera vez (para obtener refresh_token)
  // Si ya tenemos refresh_token, usamos select_account para evitar pantalla de consentimiento
  const prompt = state.driveRefreshToken ? "select_account" : "consent";
  const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${DRIVE_CLIENT_ID}&redirect_uri=${encodeURIComponent(origin)}&response_type=code&access_type=offline&prompt=${prompt}&scope=${scope}`;
  window.location.href = url;
}

function driveLogout() {
  state.driveToken = null;
  state.driveRefreshToken = null;
  state.driveTokenExpiry = 0;
  state.driveFileId = null;
  localStorage.removeItem("drive_token");
  localStorage.removeItem("drive_token_expiry");
  localStorage.removeItem("drive_refresh_token");
  localStorage.removeItem("drive_file_id");
  setState({syncStatus:"idle"});
  showToast("Drive desconectado");
}

async function handleOAuthCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (!code) return;
  const origin = window.location.origin + window.location.pathname.replace(/\/+$/, '');
  window.history.replaceState(null, "", window.location.pathname);
  try {
    const res = await fetch("/auth/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, redirect_uri: origin })
    });
    const data = await res.json();
    if (data.access_token) {
      state.driveToken = data.access_token;
      state.driveTokenExpiry = Date.now() + (data.expires_in || 3600) * 1000;
      localStorage.setItem("drive_token", data.access_token);
      localStorage.setItem("drive_token_expiry", String(state.driveTokenExpiry));
      if (data.refresh_token) {
        state.driveRefreshToken = data.refresh_token;
        localStorage.setItem("drive_refresh_token", data.refresh_token);
      }
      showToast("✓ Drive conectado");
      render();
      loadFromDrive();
    } else {
      showToast("Error conectando Drive: " + (data.error || "desconocido"));
    }
  } catch(e) {
    console.error("OAuth callback error:", e);
    showToast("Error conectando Drive");
  }
}

async function refreshDriveToken() {
  if (!state.driveRefreshToken) return false;
  try {
    const res = await fetch("/auth/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ grant_type: "refresh_token", refresh_token: state.driveRefreshToken })
    });
    const data = await res.json();
    if (data.access_token) {
      state.driveToken = data.access_token;
      state.driveTokenExpiry = Date.now() + (data.expires_in || 3600) * 1000;
      localStorage.setItem("drive_token", data.access_token);
      localStorage.setItem("drive_token_expiry", String(state.driveTokenExpiry));
      return true;
    }
  } catch(e) {
    console.error("Refresh token error:", e);
  }
  return false;
}

async function ensureValidToken() {
  // Token válido con más de 5 min de vida → OK
  if (state.driveToken && state.driveTokenExpiry && Date.now() < state.driveTokenExpiry - 5*60*1000) {
    return true;
  }
  // Intentar refresh silencioso
  if (state.driveRefreshToken) {
    return await refreshDriveToken();
  }
  // Sin refresh token y access token vencido → necesita relogin
  if (state.driveToken) {
    await handleTokenExpired();
  }
  return false;
}

function hoy() { return new Date().toISOString().split("T")[0]; }
function buildHoraSel(val, fn) {
  const parts=(val||"").split(":"), h=parts[0]||"", m=parts[1]||"";
  const opt=(list,cur)=>[`<option value=""${cur===""?" selected":""}>--</option>`,...list.map(o=>`<option${cur===o?" selected":""}>${o}</option>`)].join("");
  const hs=Array.from({length:24},(_,i)=>String(i).padStart(2,"0"));
  const ms=Array.from({length:60},(_,i)=>String(i).padStart(2,"0"));
  const oc=`(function(el){var s=el.parentNode.querySelectorAll('select');${fn}(s[0].value,s[1].value)})(this)`;
  return `<div style="display:flex;gap:6px;align-items:center"><select onchange="${oc}">${opt(hs,h)}</select><span style="color:var(--muted);font-weight:600">:</span><select onchange="${oc}">${opt(ms,m)}</select></div>`;
}
function horaFrom(hh,mm){ return (!hh&&!mm)?null:((hh||"00")+":"+(mm||"00")); }
function setHora(hh,mm){ state.hora=horaFrom(hh,mm); }
function setIAHora(hh,mm){ state._iaHora=horaFrom(hh,mm); }
function setEditHora(hh,mm){ state._editHora=horaFrom(hh,mm); }
function horaAhora() { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function cmpGastoDesc(a,b) {
  if(a.fecha!==b.fecha) return a.fecha<b.fecha?1:-1;
  const ha=a.hora||"", hb=b.hora||"";
  if(ha&&hb&&ha!==hb) return ha<hb?1:-1;
  return (parseInt(b.id)||0)-(parseInt(a.id)||0);
}

function fmtMonto(n, m) {
  const sym = m==="U$S"?"U$S ":m==="Euros"?"€":m==="CLP"?"CLP ":"$";
  return sym + Number(n).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0});
}

function medioStr(m, sm) { return m?(sm?`${m} · ${sm}`:m):null; }
function esTCMedio(m){return m==="TC ARS"||m==="TC U$S"||m==="TC EUR";}
function esCuotasMode(medio,tcCuotas){return medio==="E-cheque"||(esTCMedio(medio)&&!!tcCuotas);}
function getTitularesConocidos() {
  const set = new Set(
    state.gastos
      .map(g => (g.titular || "").trim())
      .filter(t => t.length > 0)
  );
  return [...set].sort((a, b) => a.localeCompare(b));
}

function acTitular(inputEl, dropdownId) {
  if (typeof inputEl === "string") inputEl = document.getElementById(inputEl);
  if (!inputEl) return;
  const q = (inputEl.value || "").toLowerCase();
  const todos = getTitularesConocidos();
  const filtrados = q.length === 0
    ? todos
    : todos.filter(t => t.toLowerCase().includes(q));
  const dd = document.getElementById(dropdownId);
  if (!dd) return;
  if (filtrados.length === 0) { dd.style.display = "none"; return; }
  dd.innerHTML = filtrados.map(t =>
    `<div class="ac-item" onmousedown="acElegir(event,'${dropdownId}')">${esc(t)}</div>`
  ).join("");
  dd.style.display = "block";
}

function getDescripcionesConocidas() {
  const set = new Set(
    state.gastos
      .map(g => (g.desc || "").trim())
      .filter(t => t.length > 0)
  );
  return [...set].sort((a, b) => a.localeCompare(b));
}

function acDesc(inputEl, dropdownId) {
  if (typeof inputEl === "string") inputEl = document.getElementById(inputEl);
  if (!inputEl) return;
  const q = (inputEl.value || "").toLowerCase();
  if (q.length < 2) { const dd0 = document.getElementById(dropdownId); if (dd0) dd0.style.display = "none"; return; }
  const todos = getDescripcionesConocidas();
  const filtrados = todos.filter(t => t.toLowerCase().includes(q) && t.toLowerCase() !== q);
  const dd = document.getElementById(dropdownId);
  if (!dd) return;
  if (filtrados.length === 0) { dd.style.display = "none"; return; }
  dd.innerHTML = filtrados.map(t =>
    `<div class="ac-item" onmousedown="acElegir(event,'${dropdownId}')">${esc(t)}</div>`
  ).join("");
  dd.style.display = "block";
}

function acElegir(e, dropdownId) {
  e.preventDefault();
  const val = e.target.textContent;
  const dd = document.getElementById(dropdownId);
  if (!dd) return;
  // Actualizar el input correspondiente y el state
  if (dropdownId === "ac-cargar") {
    state.titular = val;
    const inp = document.getElementById("inp-titular");
    if (inp) inp.value = val;
  } else if (dropdownId === "ac-desc-cargar") {
    state.desc = val;
    const inp = document.getElementById("inp-desc");
    if (inp) inp.value = val;
  } else if (dropdownId === "ac-desc-modal") {
    state._editDesc = val;
    const inp = dd.previousElementSibling;
    if (inp) inp.value = val;
  } else {
    state._editTitular = val;
    // Buscar el input dentro del mismo contenedor
    const inp = dd.previousElementSibling;
    if (inp) inp.value = val;
  }
  dd.style.display = "none";
}

function acCerrar(dropdownId) {
  const dd = document.getElementById(dropdownId);
  if (dd) dd.style.display = "none";
}

function splitSum(parts) { return parts.reduce((s,p)=>s+(parseFloat(p.pct)||0),0); }

function detectarFrecuentes() {
  const count={};
  state.gastos.forEach(g=>{
    const k=`${g.empresa}||${(g.desc||"").toLowerCase().trim()}`;
    if(!count[k]) count[k]={n:0,sample:g};
    count[k].n++;
  });
  return Object.values(count).filter(v=>v.n>=2).map(v=>v.sample);
}

// Toast
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2400);
}

// ── Re-render ─────────────────────────────────────────────────
function setState(updates, doRender=true) {
  Object.assign(state, updates);
  if (doRender) render();
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = buildApp();
  attachEvents();
  const modalRoot = document.getElementById("modal-root");
  modalRoot.innerHTML = state.gastoEditando ? buildModalEditarGasto() : (state.gastoViendo ? buildModalVerGasto() : "");
}

function buildApp() {
  return `

    ${state.tab==="ia"       ? buildIA()        : ""}

    ${state.tab==="resumen"  ? buildResumen()   : ""}
    ${state.tab==="categorias"? buildCategoriasTab() : ""}

function buildHeader() {
  let driveIndicator;
  if (state.isOffline) {
    driveIndicator = `<span style="color:#6B7280;font-family:monospace;font-size:11px;display:inline-flex;align-items:center;gap:4px">⚡ Sin conexión</span>`;
  } else if (!state.driveToken) {

function buildTabs() {
  const tabs = [["cargar","＋ Cargar"],["ia","✦ IA"],["lista","≡ Gastos"],["buscar","🔍 Buscar"],["resumen","◈ Total"],["categorias","🏷 Cat."]];

}

function getCats(g) {
  if (Array.isArray(g.categorias)) return g.categorias.filter(Boolean);
  if (g.categoria) return [g.categoria];
  return [];
}
function catsEnUso(name) { return state.gastos.filter(g => getCats(g).includes(name)).length; }
function esCatProyecto(c) { return (state.catsProyecto||[]).includes(c); }
// Devuelve [{cat, idx}] en el orden de state.categorias, separado por eje
function catsPorEje() {
  const proyectos = [], tipos = [];
  state.categorias.forEach((c,i) => (esCatProyecto(c) ? proyectos : tipos).push({cat:c, idx:i}));
  return {proyectos, tipos};
}
function replaceCatInGastos(oldName, newName) {
  // newName null => quitar la categoría; string => renombrarla
  state.gastos = state.gastos.map(g=>{
    const cats = getCats(g);
    if (!cats.includes(oldName)) return g;
    const nuevas = newName ? cats.map(c=>c===oldName?newName:c) : cats.filter(c=>c!==oldName);
    return {...g, categorias: nuevas, updatedAt: Date.now()};
  });
}
function buildCatMultiPicker(selected, toggleFn) {
  const sel = selected || [];
  // Las archivadas no se ofrecen como opción nueva (para no ensuciar la carga de gastos con
  // viajes/categorías ya cerrados), pero si el gasto ya la tiene asignada se sigue mostrando
  // para poder verla o sacarla.
  const { proyectos: proyAll, tipos: tipoAll } = catsPorEje();
  const visible = ({cat}) => !esCatArchivada(cat) || sel.includes(cat);
  const proyectos = proyAll.filter(visible), tipos = tipoAll.filter(visible);
  const btn = ({cat,idx}) => {
    const active = sel.includes(cat);
    return `<button onclick="${toggleFn}(${idx})" style="padding:8px 6px;border-radius:8px;border:2px solid ${active?"var(--accent)":"var(--border)"};background:${active?"rgba(245,158,11,.12)":"transparent"};color:${active?"var(--accent)":"var(--muted)"};font-size:12px;font-weight:${active?600:400};cursor:pointer">${active?"✓ ":""}${esc(cat)}</button>`;
  };
  const grid = arr => `<div class="emp-grid" style="grid-template-columns:repeat(auto-fill,minmax(88px,1fr))">${arr.map(btn).join("")}</div>`;
  // Si no hay ninguna marcada como proyecto, mostramos una sola grilla como siempre
  if (!proyectos.length) return grid(tipos);
  const lbl = t => `<div style="font-size:9px;font-family:monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:2px 0 4px">${t}</div>`;
  return `${lbl("◈ Proyecto / Viaje")}${grid(proyectos)}${tipos.length?`${lbl("Tipo de gasto")}${grid(tipos)}`:""}`;
}

function buildEmpGrid(sel, onclickFn) {
  return `<div class="emp-grid">${EMPRESAS.map(e=>{
    const active=sel===e, c=EMP[e];
    return `<button onclick="${onclickFn}('${e}')" style="padding:10px 8px;border-radius:8px;border:2px solid ${active?c.border:"var(--border)"};background:${active?c.bg:"transparent"};color:${active?c.text:"var(--muted)"};font-family:monospace;font-size:12px;font-weight:500">${e}</button>`;
  }).join("")}</div>`;
}

function buildMedioPicker(medio, subMedio, setFn, setSubFn) {
  const tipos = Object.keys(MEDIOS).sort((a,b)=>a.localeCompare(b)).map(k=>{
    const active=medio===k, c=MEDIOS[k].color;
    return `<button class="medio-tipo-btn" onclick="${setFn}('${k}')" style="border-color:${active?c:"var(--border)"};background:${active?c+"22":"transparent"};color:${active?c:"var(--muted)"};font-weight:${active?600:400}">${k}</button>`;
  }).join("");
  const subs = (medio && MEDIOS[medio]) ? `<div class="medio-subs">${[...MEDIOS[medio].sub].sort((a,b)=>a.localeCompare(b)).map(s=>{
    const active=subMedio===s, c=MEDIOS[medio].color;
    return `<button class="medio-sub-btn" onclick="${setSubFn}('${s}')" style="border-color:${active?c:"var(--border)"};background:${active?c+"22":"transparent"};color:${active?c:"var(--muted)"}">${s}</button>`;
  }).join("")}</div>` : "";
  return `<div class="medio-tipos">${tipos}</div>${subs}`;
}

function buildSplitEditor(parts, updateFn, addFn, eqFn, pctFn, totalId) {
  const total = splitSum(parts);
  const rows = parts.map((p,i)=>`
    <div class="split-row">
      <select style="flex:2" onchange="${updateFn}(${i},'empresa',this.value)">
        <option value="">Empresa...</option>
        ${EMPRESAS.map(e=>`<option value="${e}"${p.empresa===e?" selected":""}>${e}</option>`).join("")}
      </select>
      <div class="pct-wrap">
        <input type="number" min="0" max="100" value="${p.pct}" oninput="${pctFn}(${i},parseFloat(this.value)||0)">
        <span class="pct-sym">%</span>
      </div>
      ${parts.length>2?`<button class="btn-icon" onclick="removeSplitPart${addFn.replace(/[^a-z]/gi,'')}(${i})">✕</button>`:""}
    </div>
  `).join("");
  return `${rows}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
      <button onclick="${addFn}()" style="background:none;border:1px dashed var(--border);border-radius:6px;color:var(--muted);font-size:12px;padding:4px 10px">+ empresa</button>
      <span id="${totalId}" style="font-family:monospace;font-size:12px;color:${total===100?"#34D399":"#EF4444"}">Total: ${total}%</span>
    </div>
    <button onclick="${eqFn}()" style="margin-top:8px;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline">Partes iguales</button>`;
}

function updateSplitTotalDisplay(id, parts) {
  const el = document.getElementById(id);
  if (!el) return;
  const t = splitSum(parts);
  el.textContent = `Total: ${t}%`;
  el.style.color = t===100 ? "#34D399" : "#EF4444";
}

const PAGE_SIZE = 50;
function buildLista() {
  const filtrados = state.filtro==="Todos" ? state.gastos : state.gastos.filter(g=>g.empresa===state.filtro);
  const sorted = [...filtrados].sort(cmpGastoDesc);
  const total = sorted.length;
  const visibles = sorted.slice(0, state.listPage * PAGE_SIZE);
  const hayMas = total > visibles.length;
  const filterBtns = ["Todos",...EMPRESAS].map(f=>`<button class="filter-btn${state.filtro===f?" active":""}" onclick="setFiltro('${f}')">${f}</button>`).join("");
  const items = visibles.length ? visibles.map(g=>`
    <div class="gasto-item" onclick="verGasto(${g.id})" style="cursor:pointer">
      <div class="dot" style="background:${EMP[g.empresa]?.border||"#666"}"></div>
      <div style="flex:1;min-width:0">
        <div class="gasto-desc">${g.titular?esc(g.titular):esc(g.desc)}</div>
        <div class="gasto-meta">${g.fecha.split("-").reverse().join("/")}${g.hora?" "+g.hora:""} · ${g.empresa} · ${g.medio||"—"}${g.titular?" · "+esc(g.desc):""}</div>
        ${getCats(g).length?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(getCats(g).join(", "))}</div>`:""}
        ${g.nota?`<div class="gasto-nota">${esc(g.nota)}</div>`:""}
      </div>
      <div class="gasto-monto">
        <div>${fmtMonto(g.monto,g.moneda)}</div>
        ${g.moneda&&g.moneda!=="ARS"?`<div style="font-size:10px;color:var(--muted)">${g.moneda}</div>`:""}
      </div>
      <button class="btn-icon" onclick="event.stopPropagation();editarGasto(${g.id})" title="Editar">✎</button>
      <button class="btn-icon" onclick="event.stopPropagation();eliminarGasto(${g.id})">✕</button>
    </div>`).join("") : `<div style="text-align:center;padding:32px;color:var(--muted);font-size:13px">Sin gastos aún.</div>`;
  const contadorHTML = total > 0 ? `<div style="font-size:12px;color:var(--muted);margin-bottom:10px">Mostrando ${visibles.length} de ${total}</div>` : "";
  const masBtn = hayMas ? `<button onclick="cargarMasGastos()" style="width:100%;padding:11px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;margin-top:8px">Cargar ${Math.min(PAGE_SIZE, total-visibles.length)} más...</button>` : "";
  return `<div class="panel"><div class="filter-row">${filterBtns}</div>${contadorHTML}${items}${masBtn}</div>`;
}

function buildResumen() {
  const MONEDAS = ["ARS","U$S","Euros","CLP"];
  const cards = EMPRESAS.map(e=>{
    const eg = state.gastos.filter(g=>g.empresa===e);
    const c = EMP[e];
    const totalesPorMoneda = MONEDAS.map(mon=>{
      const t = eg.filter(g=>(g.moneda||"ARS")===mon).reduce((s,g)=>s+g.monto,0);
      return t > 0 ? `<div style="font-family:monospace;font-size:14px;font-weight:500;color:${c.text}">${fmtMonto(t,mon)}</div>` : "";
    }).filter(Boolean).join("");
    return `<div class="res-card" style="border:1px solid ${c.border}55;background:${c.bg}">
      <div onclick="setFiltro('${e}');setTab('lista')" style="cursor:pointer">
        <div style="font-size:10px;font-family:monospace;color:var(--muted);text-transform:uppercase;margin-bottom:6px">${e}</div>
        ${totalesPorMoneda || `<div style="font-size:12px;color:var(--muted)">Sin gastos</div>`}
        <div style="font-size:11px;color:var(--muted);margin-top:6px">${eg.length} gasto${eg.length!==1?"s":""}</div>
      </div>
      ${eg.length > 0 ? `<button onclick="exportarExcel('${e}')" style="margin-top:8px;width:100%;padding:5px 8px;background:${c.border}22;color:${c.text};border:1px solid ${c.border}55;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer">⬇ Exportar</button>` : ""}
    </div>`;
  }).join("");
  const totalesGlobal = MONEDAS.map(mon=>{
    const t = state.gastos.filter(g=>(g.moneda||"ARS")===mon).reduce((s,g)=>s+g.monto,0);
    return t > 0 ? `<div style="margin-bottom:8px">
      <div class="label">${mon}</div>
      <div style="font-family:monospace;font-size:24px;font-weight:500;color:var(--accent)">${fmtMonto(t,mon)}</div>
    </div>` : "";
  }).filter(Boolean).join("");
  const inputStyleR = "width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:13px;box-sizing:border-box;outline:none";
  const hayFiltroFecha = state.exportDesde||state.exportHasta;
  const gastosFiltradosExport = hayFiltroFecha
    ? state.gastos.filter(g=>(!state.exportDesde||g.fecha>=state.exportDesde)&&(!state.exportHasta||g.fecha<=state.exportHasta))
    : state.gastos;
  const labelFecha = hayFiltroFecha ? ` (${gastosFiltradosExport.length} gastos en rango)` : "";
  return `<div class="panel">
    <div class="res-grid">${cards}</div>
    <div style="margin-bottom:20px">
      ${totalesGlobal}
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${state.gastos.length} gastos registrados</div>
    </div>
    <div style="border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600">Filtrar export por fecha</div>

function attachEvents() {

function initCatDrag() {
  const items = [...document.querySelectorAll(".cat-item")];
  if (!items.length) return;
  let dragIdx = null;

  // El orden visual está separado en secciones, así que la posición en el DOM ya no
  // coincide con el índice en state.categorias: usamos data-idx como fuente de verdad.
  const realIdx = el => parseInt(el.dataset.idx);
  const moverCat = (fromEl, toEl) => {
    if (!fromEl || !toEl || fromEl === toEl) return;
    if (fromEl.dataset.proj !== toEl.dataset.proj) return showToast("⚠ Reordená dentro de la misma sección");
    const from = realIdx(fromEl), to = realIdx(toEl);
    if (isNaN(from) || isNaN(to) || from === to) return;
    const cats = [...state.categorias];
    const [m] = cats.splice(from, 1);
    cats.splice(to, 0, m);
    state.categorias = cats;
    localStorage.setItem("cats_reordered_at", Date.now().toString());
    saveAll(); render();
  };
  items.forEach((item, i) => {
    const handle = item.querySelector(".cat-drag-handle");

    // Desktop HTML5 drag
    item.addEventListener("dragstart", e => {
      dragIdx = i;
      e.dataTransfer.effectAllowed = "move";
      setTimeout(() => item.style.opacity = "0.5", 0);
    });
    item.addEventListener("dragover", e => {
      e.preventDefault();
      items.forEach((el, j) => el.style.borderTop = (j === i && i !== dragIdx) ? "2px solid var(--accent)" : "");
    });
    item.addEventListener("dragleave", () => { item.style.borderTop = ""; });
    item.addEventListener("dragend", () => {
      items.forEach(el => { el.style.borderTop = ""; el.style.opacity = ""; });
      dragIdx = null;
    });
    item.addEventListener("drop", e => {
      e.preventDefault();
      items.forEach(el => { el.style.borderTop = ""; el.style.opacity = ""; });
      if (dragIdx !== null && dragIdx !== i) {
        moverCat(items[dragIdx], item);
      }
      dragIdx = null;
    });

    // Mobile touch drag
    if (!handle) return;
    handle.addEventListener("touchstart", e => {
      e.preventDefault();
      dragIdx = i;
      item.style.opacity = "0.6";
      item.style.background = "rgba(245,158,11,0.08)";
    }, {passive: false});
    handle.addEventListener("touchmove", e => {
      e.preventDefault();
      const t = e.touches[0];
      const target = document.elementFromPoint(t.clientX, t.clientY)?.closest(".cat-item");
      items.forEach(el => el.style.borderTop = "");
      if (target && target !== item) target.style.borderTop = "2px solid var(--accent)";
    }, {passive: false});
    handle.addEventListener("touchend", e => {
      const t = e.changedTouches[0];
      const target = document.elementFromPoint(t.clientX, t.clientY)?.closest(".cat-item");
      item.style.opacity = "";
      item.style.background = "";
      items.forEach(el => el.style.borderTop = "");
      if (target && target !== item) {
        moverCat(item, target);
      }
      dragIdx = null;
    }, {passive: true});
  });
}

function calcularTotalesBusqueda(resultados) {
  if (!resultados || resultados.length === 0) return "";
  const MONEDAS = ["ARS","U$S","Euros","CLP"];
  const totales = MONEDAS.map(mon=>{
    const t = resultados.filter(g=>(g.moneda||"ARS")===mon).reduce((s,g)=>s+g.monto,0);
    return t !== 0 ? {mon, t} : null;
  }).filter(Boolean);
  if (totales.length === 0) return "";
  const partes = totales.map(({mon,t})=>`<span style="font-family:monospace;font-weight:700;font-size:16px;color:var(--fg)">${fmtMonto(t,mon)}</span>`).join(`<span style="color:var(--muted);font-size:12px;margin:0 6px">+</span>`);
  return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
    <span style="font-size:12px;color:var(--muted)">Total filtrado</span>
    <span>${partes}</span>
  </div>`;
}

function busquedaInput(val) {

// Ciclo de 3 estados: neutro -> incluir -> excluir -> neutro
function toggleFiltroCat(i) {
  const c = state.categorias[i];
  if (!c) return;
  const inc = state.filtroBCats || [], exc = state.filtroBCatsExcl || [];
  if (inc.includes(c))      setState({filtroBCats: inc.filter(x=>x!==c), filtroBCatsExcl: [...exc, c]});
  else if (exc.includes(c)) setState({filtroBCatsExcl: exc.filter(x=>x!==c)});
  else                      setState({filtroBCats: [...inc, c]});
}
function getFiltradosBusqueda() {
  const q = (state.busqueda||"").toLowerCase().trim();
  const emp = state.filtroBEmp||"";
  const cats = state.filtroBCats||[];
  const catsExcl = state.filtroBCatsExcl||[];
  const med = state.filtroBMedio||"";
  const pag = state.filtroBPagador||"";
  const desde = state.filtroDesde||"";
  const hasta = state.filtroHasta||"";
  const mon = state.filtroBMoneda||"";
  // Aceptamos coma o punto como separador decimal
  const numFiltro = v => { const s=String(v==null?"":v).trim().replace(",","."); if(!s) return null; const n=parseFloat(s); return isNaN(n)?null:n; };
  const mMin = numFiltro(state.filtroMontoMin);
  const mMax = numFiltro(state.filtroMontoMax);
  const hayFiltro = q||emp||cats.length||catsExcl.length||med||mon||mMin!==null||mMax!==null||pag||desde||hasta;
  if(!hayFiltro) return null;
  return [...state.gastos].filter(g=>{
    if(q && !((g.titular||"").toLowerCase().includes(q)||(g.desc||"").toLowerCase().includes(q)||(g.nota||"").toLowerCase().includes(q))) return false;
    if(emp && g.empresa!==emp) return false;
    if(cats.length) { const gc=getCats(g); if(!cats.every(c=>gc.includes(c))) return false; }
    if(catsExcl.length) { const gc=getCats(g); if(gc.some(c=>catsExcl.includes(c))) return false; }
    if(mon && (g.moneda||"ARS")!==mon) return false;
    if(mMin!==null || mMax!==null) {
      // Comparamos en centavos para evitar los errores de redondeo de los flotantes
      const cts = Math.round((parseFloat(g.monto)||0)*100);
      if(mMin!==null && cts < Math.round(mMin*100)) return false;
      if(mMax!==null && cts > Math.round(mMax*100)) return false;
    }
    if(med && !(g.medio||"").startsWith(med)) return false;
    if(pag && g.pagador!==pag) return false;
    if(desde && g.fecha<desde) return false;
    if(hasta && g.fecha>hasta) return false;
    return true;
  }).sort(cmpGastoDesc);
}

function agregarCatAResultados() {
  const resultados = getFiltradosBusqueda();
  if (!resultados || !resultados.length) return;
  const v = prompt(`Categoría a agregar a los ${resultados.length} gastos filtrados:`);
  if (!v || !v.trim()) return;
  const cat = normCatName(v.trim());
  if (!cat || cat.toLowerCase() === "sin categoría") return;

  const ids = new Set(resultados.map(g => String(g.id)));
  const yaLaTienen = resultados.filter(g => getCats(g).includes(cat)).length;
  const aModificar = resultados.length - yaLaTienen;
  if (!aModificar) return showToast(`Los ${resultados.length} gastos ya tienen "${cat}"`);

  const esNueva = !state.categorias.includes(cat);
  const msg = `Se va a agregar "${cat}" a ${aModificar} gasto${aModificar!==1?"s":""}`
    + (yaLaTienen ? ` (${yaLaTienen} ya la ${yaLaTienen!==1?"tienen":"tiene"})` : "")
    + (esNueva ? `.\n\n"${cat}" no existe todavía: se va a crear como categoría nueva.` : ".")
    + `\n\n¿Continuar?`;
  if (!confirm(msg)) return;

  state.gastos = state.gastos.map(g => {
    if (!ids.has(String(g.id))) return g;
    const cats = getCats(g);
    if (cats.includes(cat)) return g;
    // Si solo tenía el placeholder, lo reemplazamos en vez de acumularlo
    const base = cats.filter(c => c !== "Sin categoría");
    return {...g, categorias: [...base, cat], updatedAt: Date.now()};
  });

  if (esNueva) {
    state.categorias = [...state.categorias, cat];
    state.deletedCategorias = (state.deletedCategorias||[]).filter(c => c !== cat);
    localStorage.setItem("deleted_cats_v1", JSON.stringify(state.deletedCategorias));
  }
  saveAll(); render();
  showToast(`✓ "${cat}" agregada a ${aModificar} gasto${aModificar!==1?"s":""}`);
}

function eliminarResultados() {
  const resultados = getFiltradosBusqueda();
  if (!resultados || !resultados.length) return;
  const n = resultados.length;
  const totales = [...new Set(resultados.map(g=>g.moneda||"ARS"))].map(mon=>{
    const t = resultados.filter(g=>(g.moneda||"ARS")===mon).reduce((s,g)=>s+g.monto,0);
    return fmtMonto(t, mon);
  }).join(" · ");
  if (!confirm(`Se van a ELIMINAR ${n} gasto${n!==1?"s":""} (${totales}).\n\nEsta acción no se puede deshacer. ¿Continuar?`)) return;
  if (!confirm(`Confirmá de nuevo: eliminar ${n} gasto${n!==1?"s":""}.`)) return;
  const ids = new Set(resultados.map(g => String(g.id)));
  state.gastos = state.gastos.filter(g => !ids.has(String(g.id)));
  state.deletedIds = [...new Set([...(state.deletedIds||[]), ...resultados.map(g=>g.id)])];
  saveAll(); render();
  showToast(`✓ ${n} gasto${n!==1?"s":""} eliminado${n!==1?"s":""}`);
}

function filtroFechaInput(campo, val) {
  state[campo] = val;

function refrescarBusqueda() {
  const hayActivos = !!(state.busqueda||state.filtroBEmp||(state.filtroBCats&&state.filtroBCats.length)||(state.filtroBCatsExcl&&state.filtroBCatsExcl.length)||state.filtroBMedio||state.filtroBMoneda||state.filtroMontoMin||state.filtroMontoMax||state.filtroBPagador||state.filtroDesde||state.filtroHasta);
  const limpiarEl = document.getElementById("buscar-limpiar-wrap");
  if (limpiarEl) limpiarEl.innerHTML = hayActivos
    ? '<button onclick="limpiarFiltrosBusqueda()" style="padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap">✕ Limpiar</button>'
    : '';
  const el = document.getElementById("buscar-results");
  if (el) el.innerHTML = buildBuscarResultsHTML();
}
// Atajos de rango: evitan tener que tipear la fecha a mano
function setRangoBusqueda(desde, hasta) {
  state.filtroDesde = desde; state.filtroHasta = hasta;
  const dEl = document.getElementById("filtro-desde"); if (dEl) dEl.value = desde;
  const hEl = document.getElementById("filtro-hasta"); if (hEl) hEl.value = hasta;
  refrescarBusqueda();
}
function rangoRelativo(dias) {
  const h = new Date();
  const d = new Date(); d.setDate(d.getDate()-dias+1);
  const f = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
  setRangoBusqueda(f(d), f(h));
}
function rangoMes(offset) {
  const n = new Date();
  const ini = new Date(n.getFullYear(), n.getMonth()+offset, 1);
  const fin = new Date(n.getFullYear(), n.getMonth()+offset+1, 0);
  const f = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;

function agregarGasto() {
  const desc = state.desc.trim();
  if(!desc) return showToast("⚠ Escribí una descripción");
  if(!state.monto||parseFloat(state.monto)<=0) return showToast("⚠ Ingresá un monto válido");
  if(MEDIOS[state.medio] && (MEDIOS[state.medio].sub||[]).length && !state.subMedio) return showToast("⚠ Elegí el sub-medio (banco) de "+state.medio);
  let _monto = parseFloat(state.monto);
  let _notaGbp = "";
  if (enModoGBP() && state.gbpMode && state.moneda==="Euros") {
    const _r = parseFloat(state.gbpRate)||1.24;
    const _eur = Math.round(_monto*_r*100)/100;
    _notaGbp = `£${_monto} → €${_eur} (TC ${_r})`;
    _monto = _eur;
  }
  const _cantCuotas = esCuotasMode(state.medio,state.tcCuotas)&&parseInt(state.cantCuotas)>0?parseInt(state.cantCuotas):null;
  const _montoCuota = _cantCuotas&&_monto>0?Math.round(_monto/_cantCuotas*100)/100:null;
  const _cantidad = parseFloat(state.cantidad)>0?parseFloat(state.cantidad):null;
  const _precioUnit = parseFloat(state.precioUnit)>0?parseFloat(state.precioUnit):null;
  const base = {desc,titular:state.titular.trim(),monto:_monto,moneda:state.moneda,fecha:state.fecha,hora:state.hora||null,medio:medioStr(state.medio,state.subMedio)||"No especificado",categorias:(state.categoriasSel&&state.categoriasSel.length)?state.categoriasSel:["Sin categoría"],nota:(_notaGbp?(state.nota.trim()?state.nota.trim()+" · ":"")+_notaGbp:state.nota.trim()),cantCuotas:_cantCuotas,montoCuota:_montoCuota,cantidad:_cantidad,precioUnit:_precioUnit,pagador:state.pagador||null,updatedAt:Date.now()};
  if(state.splitMode) {
    if(splitSum(state.splitParts)!==100) return showToast("⚠ Los % deben sumar 100");
    if(state.splitParts.some(p=>!p.empresa)) return showToast("⚠ Asigná empresa a cada parte");
    const groupId = Date.now();
    const nuevos = state.splitParts.map((p,i)=>({...base,id:groupId+i,empresa:p.empresa,monto:Math.round(base.monto*p.pct/100*100)/100,nota:`${base.nota?base.nota+" · ":""}División ${p.pct}%`,splitGroupId:groupId,splitPct:p.pct}));
    state.gastos = [...state.gastos,...nuevos];
    showToast(`✓ ${nuevos.length} gastos agregados`);
  } else {
    if(!state.empresa) return showToast("⚠ Seleccioná una empresa");
    state.gastos = [...state.gastos,{id:Date.now(),empresa:state.empresa,...base}];
    showToast("✓ Gasto agregado");
  }
  saveAll();
  setState({desc:"",titular:"",monto:"",fecha:hoy(),hora:horaAhora(),nota:"",categoriasSel:defaultCategoriaSel(),medio:defaultMedio(),subMedio:null,empresa:null,moneda:defaultMoneda(),cantCuotas:"",tcCuotas:false,pagador:null,_pagadorAbierto:false,_notaAbierta:false,cantidad:"",precioUnit:"",_cantPrecioAbierta:false});
}

// Voz
let recognition = null;
let _micStream = null;
let _silenceTimer = null;
function _liberarMic() {
  if(_micStream) { _micStream.getTracks().forEach(t=>t.stop()); _micStream=null; }
  if(_silenceTimer) { clearTimeout(_silenceTimer); _silenceTimer=null; }
}
function iniciarVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) { showToast("⚠ Usá el dictado del teclado"); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    _micStream = stream;
    recognition = new SR();
    recognition.lang="es-AR"; recognition.continuous=true; recognition.interimResults=true;
    recognition.onstart = ()=>setState({vozActiva:true,vozStatus:"escuchando"});
    recognition.onresult = e=>{
      const t=Array.from(e.results).map(r=>r[0].transcript).join("");
      state.textoLibre=t;
      state.vozStatus="escuchando"; render();
      // Reiniciar timer de silencio: 4 segundos sin resultado final = detener
      if(_silenceTimer) clearTimeout(_silenceTimer);
      if(e.results[e.results.length-1].isFinal) {
        _silenceTimer = setTimeout(()=>detenerVoz(), 4000);
      }
    };
    recognition.onerror = e=>{ _liberarMic(); setState({vozActiva:false,vozStatus:"error"}); showToast("Error mic: "+e.error); };
    recognition.onend = ()=>{ _liberarMic(); setState({vozActiva:false,vozStatus:"listo"}); };
    recognition.start();
  }).catch(err=>{ showToast("Sin acceso al micrófono: "+err.message); });
}
function detenerVoz() { if(recognition) recognition.stop(); _liberarMic(); setState({vozActiva:false}); }

// IA
async function procesarIA() {
  if(!state.imgB64&&!state.textoLibre.trim()) return showToast("⚠ Subí imagen o escribí algo");
  if(!state.iaSplitMode&&!state.empIA) return showToast("⚠ Seleccioná empresa");
  setState({iaLoading:true,iaResult:null});
  try {
    const titularesConocidos = getTitularesConocidos();
    const titularesHint = titularesConocidos.length > 0
      ? ` Para el campo titular: si el comercio/proveedor que encontrás coincide o es muy similar a alguno de esta lista, usá exactamente ese nombre: [${titularesConocidos.join(", ")}]. Si no coincide con ninguno, usá el nombre tal como aparece.`
      : "";
    const subMediosHint = Object.entries(MEDIOS).map(([k,v])=>v.sub&&v.sub.length?`${k}: [${v.sub.join(", ")}]`:"").filter(Boolean).join("; ");
    const prompt = `Hoy es ${hoy()}. ` + (state.textoLibre?`Texto: "${state.textoLibre}". `:"") + `Extraé: titular (nombre del comercio/proveedor), desc (concepto del gasto), monto (número), moneda (ARS/U$S/Euros/CLP), fecha (YYYY-MM-DD o null, si no tiene año usá el año de hoy), medio (Tx/TC ARS/TC U$S/TC EUR/Cash/MP/PayPal/Tx U$S Zelle), subMedio (null o el nombre exacto de la tarjeta/sub según esta lista — ${subMediosHint}), categoria (una de: ${state.categorias.join("/")}).${titularesHint} Solo JSON sin backticks.`;
    let messages;
    if(state.imgB64) {
      messages=[{role:"user",content:[{type:"image",source:{type:"base64",media_type:state.imgMime||"image/jpeg",data:state.imgB64}},{type:"text",text:prompt}]}];
    } else {
      messages=[{role:"user",content:`Del texto: "${state.textoLibre.trim()}". ${prompt}`}];
    }
    const res = await fetch("/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:ANTHROPIC_MODEL,max_tokens:500,messages})});
    const data = await res.json();
    if (!data.content) { const errDetail = data.error ? data.error.message || JSON.stringify(data.error) : JSON.stringify(data); throw new Error(errDetail); } const raw = data.content.map(c=>c.text||"").join("").trim();
    const clean = raw.replace(/```json|```/g,"").trim();
    // Try direct parse first, then extract JSON object
    let parsed;
    try {
      parsed = JSON.parse(clean);
    } catch(e1) {
      const jm = clean.match(/\{[\s\S]*\}/);
      if (!jm) throw new Error("Sin JSON: " + clean.slice(0,100));
      try { parsed = JSON.parse(jm[0]); }
      catch(e2) { throw new Error("JSON invalido: " + jm[0].slice(0,100)); }
    }
    setState({iaResult:parsed,iaLoading:false});
  } catch(e) { const errMsg = e.message; console.error('IA Error:', errMsg); showToast("Error IA: "+errMsg); setState({iaLoading:false}); }
}
