<!DOCTYPE html>
<html lang="es">
<head>

<title>Gestor de Gastos</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0F0F11;--surface:#18181C;--border:#2A2A30;--text:#F0F0F5;--muted:#8888A0;
  --accent:#F59E0B;--c2:#2563EB;--nafil:#059669;--mb:#EA580C;--cdm:#DC2626;--lck:#7C3AED;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 16px 80px;}
.app{max-width:600px;margin:0 auto;}
input,select,textarea,button{font-family:inherit;}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:10px 12px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:#1a1a20;}
textarea{resize:vertical;}
button{cursor:pointer;}
.label{display:block;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
.field{margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-primary{width:100%;padding:12px;background:var(--accent);color:#0F0F11;border:none;border-radius:8px;font-size:14px;font-weight:600;margin-top:4px;}
.btn-primary:disabled{opacity:.4;}
.emp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin:0 0 20px;}
.tab{flex:1;padding:8px 2px;border:none;background:transparent;color:var(--muted);font-size:11px;border-radius:7px;font-weight:500;}
.tab.active{background:var(--border);color:var(--text);}
.filter-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.filter-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-family:'DM Mono',monospace;}
.filter-btn.active{border-color:var(--accent);color:var(--accent);}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.gasto-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.gasto-desc{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gasto-meta{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;}
.gasto-nota{font-size:11px;color:#555;margin-top:1px;}
.gasto-monto{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;flex-shrink:0;text-align:right;}
.btn-icon{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 4px;flex-shrink:0;}
.medio-tipos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.medio-tipo-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-family:'DM Mono',monospace;}
.medio-subs{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--border);}
.medio-sub-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;white-space:nowrap;}
.split-toggle{display:flex;gap:8px;margin-bottom:16px;}
.split-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-family:'DM Mono',monospace;}
.split-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(245,158,11,.12);}
.split-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.pct-wrap{flex:1;position:relative;}
.pct-sym{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none;}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;}
.upload-zone:hover{border-color:var(--accent);}
.preview-img{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin-top:12px;}
.ia-result{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:14px;}
.sugerencia{margin-top:6px;padding:8px 12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:8px;display:flex;align-items:center;justify-content:space-between;}
.sync-badge{font-family:'DM Mono',monospace;font-size:11px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E1E26;border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;}
.toast.show{opacity:1;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:500px;margin-top:20px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.cats-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;}
.cats-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;}
.cat-item{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:8px 12px;border:1px solid var(--border);margin-bottom:6px;}
.res-card{border-radius:10px;padding:14px;}
.ac-wrap{position:relative;}
.ac-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;z-index:500;max-height:200px;overflow-y:auto;margin-top:2px;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.ac-item{padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.ac-active{background:var(--accent);color:#fff;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<body>
<div class="app" id="app"></div>

<script>
// ── Datos ─────────────────────────────────────────────────────
const EMPRESAS = ["C2","LCK","AKC","CDM","NAFIL","MB","FABIANA"];
const ANTHROPIC_MODEL = "claude-sonnet-4-5";
const DRIVE_FILE_NAME = "gastos_app_data.json";
const DRIVE_CLIENT_ID = "1051749004626-0h5d41e0uq148uq2srrvvfu3p1f9cckk.apps.googleusercontent.com";

const CATEGORIAS_DEFAULT = ["Combustible","Alimentación","Equipamiento","Mantenimiento","Transporte","Servicios","Honorarios","Marketing","Insumos","Otros"];

const MEDIOS = {
  Tx:       {color:"#38BDF8",sub:["Santander BW","Santander NF","Santander LC","Galicia C2","Galicia BW","Galicia LC","Supervielle C2","Supervielle LC","BBVA AK","BBVA LC","CIU AK","CIU BW","CIU NF","Macro LC"]},
  "TC ARS": {color:"#A78BFA",sub:["Mastercard Supervielle Leandro","Mastercard BBVA Leandro","Mastercard Ciudad Mama","AMEX Leandro","Visa Santander Leandro","Visa BBVA Leandro","Visa BBVA Mama","Mastercard BBVA Mamá","Visa Ciudad Mama","AMEX Santander Leandro","Mastercard Ciudad Leandro","Mercadopago Master","VISA MACRO","AMEX MACRO","Visa Supervielle Leandro","Mastercard Cencosud Leandro","Visa GALICIA","MC Galicia"]},
  "TC U$S": {color:"#34D399",sub:["Visa Chase","MC Citi"]},
  "TC EUR": {color:"#FCD34D",sub:["Santander débito","Caixabank débito"]},
  Cash:     {color:"#FB923C",sub:["ARS","U$S","Euros","CLP"]},
  MP:       {color:"#60A5FA",sub:["MP LC","MP C2","MP AK"]},
  PayPal:   {color:"#003087",sub:[]},
  Bizum:    {color:"#00CFFF",sub:[]},
  "Tx U$S Zelle": {color:"#6D1ED4",sub:["Chase Leandro","Citibank Leandro","Carbugia FL","Carbugia DW","Nafyl FL","Nafyl DW"]},
  "E-cheque":{color:"#10B981",sub:["Santander BW","Santander NF","Santander LC","Galicia C2","Galicia BW","Galicia LC","Supervielle C2","Supervielle LC","BBVA AK","BBVA LC","CIU AK","CIU BW","CIU NF","Macro LC"]},
};

const EMP = {
  FABIANA: {bg:"rgba(6,182,212,.15)",  border:"#0891B2",text:"#22D3EE"},
  C2:    {bg:"rgba(37,99,235,.15)",  border:"#2563EB",text:"#60A5FA"},
  NAFIL: {bg:"rgba(5,150,105,.15)",  border:"#059669",text:"#34D399"},
  MB:    {bg:"rgba(234,88,12,.15)",  border:"#EA580C",text:"#FB923C"},
  CDM:   {bg:"rgba(219,39,119,.15)",  border:"#DB2777",text:"#F472B6"},
  LCK:   {bg:"rgba(124,58,237,.15)", border:"#7C3AED",text:"#A78BFA"},
  AKC:   {bg:"rgba(234,179,8,.15)",   border:"#CA8A04",text:"#FDE047"},
};

// ── Modo viaje: defaults temporales hasta el 25/07/2026 ──────
function enModoViaje(){ return hoy() <= "2026-07-25"; }
function defaultMoneda(){ return enModoViaje() ? "Euros" : "ARS"; }
function defaultMedio(){ return enModoViaje() ? "TC EUR" : null; }
function defaultSplitParts(){ return enModoViaje() ? [{empresa:"CDM",pct:66},{empresa:"LCK",pct:34}] : [{empresa:null,pct:50},{empresa:null,pct:50}]; }
function enModoGBP(){ return new Date() <= new Date("2026-07-23T14:00:00"); }
function enModoCatEuropa(){ return new Date() <= new Date("2026-07-23T23:59:59"); }
function normCatName(s) { const t = String(s||"").trim(); return t ? t.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ") : t; }
function defaultCategoriaSel(){ return enModoCatEuropa() ? [normCatName("EUROPA JUL26")] : []; }

// ── Estado global ─────────────────────────────────────────────
let state = {
  tab: "cargar",
  gastos: sanearIds(load("gastos_v5", [])),
  categorias: load("cats_v5", CATEGORIAS_DEFAULT),
  deletedCategorias: load("deleted_cats_v1", []),
  // form
  empresa: null, desc:"", titular:"", monto:"", moneda:defaultMoneda(), fecha:hoy(), hora:horaAhora(),
  medio:defaultMedio(), subMedio:null, categoriasSel:defaultCategoriaSel(), nota:"", cantCuotas:"", tcCuotas:false, pagador:null, gbpMode:false, gbpRate: (localStorage.getItem("gbp_rate_manual")?parseFloat(localStorage.getItem("gbp_rate")):0)||1.24,
  splitMode:false, splitParts:defaultSplitParts(),
  // ia
  empIA:null, textoLibre:"", iaLoading:false, iaResult:null,
  _iaTitular:undefined,
  imgB64:null, imgPreview:null,
  iaSplitMode:false, iaSplitParts:defaultSplitParts(),
  // voz
  vozActiva:false, vozStatus:"",
  // lista
  filtro:"Todos",
  busqueda:"", filtroBEmp:"", filtroBCats:[], filtroBMedio:"", filtroBPagador:"", filtroDesde:"", filtroHasta:"",
  exportDesde:"", exportHasta:"",
  // modales
  showCats:false, plantillaEnUso:null, sugerencia:null, gastoViendo:null, listPage:1,
  // sync
  syncStatus:"idle", isOffline:!navigator.onLine,
  // drive
  driveToken: localStorage.getItem("drive_token") || null,
  driveTokenExpiry: parseInt(localStorage.getItem("drive_token_expiry") || "0"),
  driveRefreshToken: localStorage.getItem("drive_refresh_token") || null,
  driveFileId: localStorage.getItem("drive_file_id") || null,
  deletedIds: load("deleted_ids_v1", []),
  pendingSync: false,
};

function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
}

function sanearIds(gastos) {
  let modified = false;
  let autoId = Date.now();
  const seen = new Set();
  const result = gastos.map(g => {
    if (!g.id || seen.has(String(g.id))) {
      g = { ...g, id: autoId++ };
      modified = true;
    }
    seen.add(String(g.id));
    return g;
  });
  if (modified) {
    localStorage.setItem("gastos_v5", JSON.stringify(result));
  }
  return result;
}

function saveAll() {
  localStorage.setItem("gastos_v5", JSON.stringify(state.gastos));
  localStorage.setItem("cats_v5", JSON.stringify(state.categorias));
  localStorage.setItem("local_modified", String(Date.now()));
  syncToDrive();
}

// Migración one-off: agrega "Traslados BsAs" a todo gasto con titular "Jetsmart Airlines"
function migrarCatJetsmartTraslados() {
  const FLAG = "migrated_jetsmart_traslados_bsas_v1";
  if (localStorage.getItem(FLAG)) return;
  const TITULAR_MATCH = "jetsmart airlines";
  const CAT = "Traslados BsAs";
  let count = 0;
  state.gastos = state.gastos.map(g => {
    if ((g.titular||"").trim().toLowerCase() !== TITULAR_MATCH) return g;
    const cats = getCats(g);
    if (cats.includes(CAT)) return g;
    count++;
    return {...g, categorias:[...cats, CAT], updatedAt: Date.now()};
  });
  if (!state.categorias.includes(CAT)) state.categorias = [...state.categorias, CAT];
  localStorage.setItem(FLAG, "1");
  if (count > 0) {
    saveAll();
    render();
    showToast(`✓ "${CAT}" agregada a ${count} gasto${count>1?"s":""} de Jetsmart Airlines`);
  } else {
    saveAll();
  }
}

// Migración one-off: estandariza el casing de todas las categorías (Primera mayúscula por palabra)
function normalizarCasingCategorias() {
  const FLAG = "migrated_cat_casing_v3";
  if (localStorage.getItem(FLAG)) return;
  const nuevas = [];
  const vistos = new Set();
  const viejosATombstone = [];
  let changed = false;
  state.categorias.forEach(c => {
    const n = normCatName(c);
    if (c !== n) { changed = true; viejosATombstone.push(c); }
    if (!vistos.has(n)) { vistos.add(n); nuevas.push(n); }
  });
  if (changed) {
    state.categorias.forEach(c => {
      const n = normCatName(c);
      if (c !== n) replaceCatInGastos(c, n);
    });
    state.categorias = nuevas;
    // Tombstone de los nombres viejos para que un sync con Drive no los vuelva a traer duplicados
    state.deletedCategorias = [...new Set([...state.deletedCategorias, ...viejosATombstone])].filter(c => !nuevas.includes(c));
    localStorage.setItem("deleted_cats_v1", JSON.stringify(state.deletedCategorias));
    saveAll();
    render();
  }
  localStorage.setItem(FLAG, "1");
}

// ── Google Drive Sync ─────────────────────────────────────────
function driveEnabled() { return state.driveToken && DRIVE_CLIENT_ID; }

// Mergea gastos de Drive con los locales usando updatedAt y deletedIds (tombstones)
function mergeGastos(driveGastos, localGastos, driveDeletedIds, localDeletedIds) {
  const allDeletedIds = new Set([...(driveDeletedIds||[]), ...(localDeletedIds||[])].map(String));
  const byId = new Map();
  let autoId = Date.now();
  // Procesar gastos de Drive primero
  (driveGastos||[]).forEach(g => {
    if (g.id === undefined || g.id === null) g.id = autoId++;
    const key = String(g.id);
    if (!allDeletedIds.has(key)) byId.set(key, g);
  });
  // Merge con locales
  (localGastos||[]).forEach(g => {
    if (g.id === undefined || g.id === null) g.id = autoId++;
    const key = String(g.id);
    if (allDeletedIds.has(key)) return;
    const existing = byId.get(key);
    if (!existing) { byId.set(key, g); return; }
    const localTime = g.updatedAt || 0;
    const driveTime = existing.updatedAt || 0;
    if (localTime >= driveTime) byId.set(key, g);
  });
  return { merged: Array.from(byId.values()), allDeletedIds: Array.from(allDeletedIds) };
}

async function fetchDriveData() {
  let fileId = state.driveFileId;
  if (!fileId) {
    const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}'+and+trashed=false&fields=files(id,name)`, {
      headers: { "Authorization": `Bearer ${state.driveToken}` }
    });
    if (search.status === 401) return { status: 401 };
    const searchData = await search.json();
    if (searchData.files && searchData.files.length > 0) {
      fileId = searchData.files[0].id;
      localStorage.setItem("drive_file_id", fileId);
      state.driveFileId = fileId;
    }
  }
  if (!fileId) return { status: 200, data: null };
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { "Authorization": `Bearer ${state.driveToken}` }
  });
  if (res.status === 401) return { status: 401 };
  if (!res.ok) return { status: res.status };
  const data = await res.json();
  return { status: 200, data, fileId };
}

async function uploadDriveData(data) {
  const content = JSON.stringify(data);
  let fileId = state.driveFileId;
  let res;
  if (fileId) {
    res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: content
    });
  } else {
    const meta = await fetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: "application/json" })
    });
    if (meta.status === 401) return { status: 401 };
    const metaData = await meta.json();
    fileId = metaData.id;
    res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: content
    });
    if (res.ok) {
      localStorage.setItem("drive_file_id", fileId);
      state.driveFileId = fileId;
    }
  }
  return { status: res.status, ok: res.ok };
}

async function hacerBackupDiario(data) {
  try {
    const hoyStr = new Date().toISOString().split("T")[0]; // YYYY-MM-DD
    const lastBackup = localStorage.getItem("last_backup_date");
    if (lastBackup === hoyStr) return; // Ya se hizo el backup hoy

    const backupName = `gastos_app_backup_${hoyStr}.json`;
    const content = JSON.stringify({ ...data, backupDate: hoyStr });

    // Crear el archivo de backup del día
    const meta = await fetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ name: backupName, mimeType: "application/json" })
    });
    if (!meta.ok) return;
    const metaData = await meta.json();
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${metaData.id}?uploadType=media`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${state.driveToken}`, "Content-Type": "application/json" },
      body: content
    });

    localStorage.setItem("last_backup_date", hoyStr);

    // Limpiar backups con más de 30 días
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 30);
    const cutoffStr = cutoff.toISOString().split("T")[0];
    const search = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=name+contains+'gastos_app_backup_'+and+trashed=false&fields=files(id,name)`,
      { headers: { "Authorization": `Bearer ${state.driveToken}` } }
    );
    if (search.ok) {
      const { files } = await search.json();
      for (const f of (files || [])) {
        const match = f.name.match(/gastos_app_backup_(\d{4}-\d{2}-\d{2})\.json/);
        if (match && match[1] < cutoffStr) {
          await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${state.driveToken}` }
          });
        }
      }
    }
  } catch(e) {
    console.warn("Backup diario falló (no crítico):", e);
  }
}

async function syncToDrive() {
  if (!navigator.onLine) {
    localStorage.setItem("pending_sync", "1");
    setState({syncStatus:"error"}, false);
    return;
  }
  if (!driveEnabled()) return;
  const ok = await ensureValidToken();
  if (!ok) { handleTokenExpired(); return; }
  setState({syncStatus:"syncing"}, false);
  try {
    // 1. Bajar lo que hay en Drive primero
    const fetched = await fetchDriveData();
    if (fetched.status === 401) { handleTokenExpired(); return; }
    if (fetched.status !== 200) throw new Error("HTTP " + fetched.status);
    const driveData = fetched.data || {};

    // 2. Mergear con lo local
    // Guardia: si Drive devuelve 0 gastos pero tenemos datos locales, es sospechoso — no tocar Drive
    const driveGastosRaw = driveData.gastos;
    if (Array.isArray(driveGastosRaw) && driveGastosRaw.length === 0 && state.gastos.length > 0) {
      console.warn("Drive devolvió 0 gastos pero hay " + state.gastos.length + " locales — sync abortado por seguridad");
      setState({syncStatus:"error"}, false);
      localStorage.setItem("pending_sync", "1");
      return;
    }
    const { merged, allDeletedIds } = mergeGastos(driveGastosRaw, state.gastos, driveData.deletedIds, state.deletedIds);
    state.gastos = merged;
    state.deletedIds = allDeletedIds;
    localStorage.setItem("gastos_v5", JSON.stringify(state.gastos));
    localStorage.setItem("deleted_ids_v1", JSON.stringify(state.deletedIds));

    // Categorías: merge respetando eliminadas localmente
    {
      const driveDeletedCats = driveData.deletedCategorias || [];
      const allDeletedCats = [...new Set([...state.deletedCategorias, ...driveDeletedCats])];
      state.deletedCategorias = allDeletedCats;
      localStorage.setItem("deleted_cats_v1", JSON.stringify(allDeletedCats));

      const driveCats = (driveData.categorias || []).filter(c => !allDeletedCats.includes(c));
      const localCats = state.categorias.filter(c => !allDeletedCats.includes(c));
      // Si el usuario reordenó localmente después del último sync de Drive, respetar orden local
      const driveLastSync = driveData.lastSync ? new Date(driveData.lastSync).getTime() : 0;
      const localReorderedAt = parseInt(localStorage.getItem("cats_reordered_at") || "0");
      const localIsNewer = localReorderedAt > driveLastSync;
      const mergedCats = localIsNewer
        ? [...new Set([...localCats, ...driveCats])]   // local gana (reorden manual reciente)
        : [...new Set([...driveCats, ...localCats])];  // drive gana (sync desde otro dispositivo)
      state.categorias = mergedCats;
      localStorage.setItem("cats_v5", JSON.stringify(state.categorias));
    }

    // 3. Backup diario y subir el resultado mergeado
    const toUpload = {
      gastos: state.gastos,
      categorias: state.categorias,
      deletedIds: state.deletedIds,
      deletedCategorias: state.deletedCategorias,
      lastSync: new Date().toISOString()
    };
    await hacerBackupDiario(toUpload);
    const uploaded = await uploadDriveData(toUpload);
    if (uploaded.status === 401) { handleTokenExpired(); return; }
    if (!uploaded.ok) throw new Error("HTTP " + uploaded.status);

    localStorage.removeItem("pending_sync");
    setState({syncStatus:"ok"});
    setTimeout(()=>{ if(state.syncStatus==="ok") setState({syncStatus:"idle"}, false); }, 3000);
  } catch(e) {
    console.error("Drive sync error:", e);
    setState({syncStatus:"error"}, false);
    localStorage.setItem("pending_sync", "1");
  }
}

async function handleTokenExpired() {
  const refreshed = await refreshDriveToken();
  if (refreshed) {
    syncToDrive();
    return;
  }
  // Refresh token inválido (puede haber expirado por modo Testing de Google)
  // Limpiarlo para que el próximo login pida consent y obtenga uno nuevo
  state.driveToken = null;
  state.driveRefreshToken = null;
  state.driveTokenExpiry = 0;
  localStorage.removeItem("drive_token");
  localStorage.removeItem("drive_token_expiry");
  localStorage.removeItem("drive_refresh_token");
  setState({syncStatus:"expired"});
  showToast("⚠ Sesión de Drive vencida — tocá Reconectar");
}

async function loadFromDrive() {
  // El merge se hace en syncToDrive, que baja, mergea y sube
  await syncToDrive();
  render();
}

function driveLogin() {
  if (!DRIVE_CLIENT_ID) { showToast("⚠ Configurá el Client ID de Google"); return; }
  const scope = encodeURIComponent("https://www.googleapis.com/auth/drive.file");
  const origin = window.location.origin + window.location.pathname.replace(/\/+$/, '');
  // prompt=consent solo la primera vez (para obtener refresh_token)
  // Si ya tenemos refresh_token, usamos select_account para evitar pantalla de consentimiento
  const prompt = state.driveRefreshToken ? "select_account" : "consent";
  const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${DRIVE_CLIENT_ID}&redirect_uri=${encodeURIComponent(origin)}&response_type=code&access_type=offline&prompt=${prompt}&scope=${scope}`;
  window.location.href = url;
}

function driveLogout() {
  state.driveToken = null;
  state.driveRefreshToken = null;
  state.driveTokenExpiry = 0;
  state.driveFileId = null;
  localStorage.removeItem("drive_token");
  localStorage.removeItem("drive_token_expiry");
  localStorage.removeItem("drive_refresh_token");
  localStorage.removeItem("drive_file_id");
  setState({syncStatus:"idle"});
  showToast("Drive desconectado");
}

async function handleOAuthCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (!code) return;
  const origin = window.location.origin + window.location.pathname.replace(/\/+$/, '');
  window.history.replaceState(null, "", window.location.pathname);
  try {
    const res = await fetch("/auth/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, redirect_uri: origin })
    });
    const data = await res.json();
    if (data.access_token) {
      state.driveToken = data.access_token;
      state.driveTokenExpiry = Date.now() + (data.expires_in || 3600) * 1000;
      localStorage.setItem("drive_token", data.access_token);
      localStorage.setItem("drive_token_expiry", String(state.driveTokenExpiry));
      if (data.refresh_token) {
        state.driveRefreshToken = data.refresh_token;
        localStorage.setItem("drive_refresh_token", data.refresh_token);
      }
      showToast("✓ Drive conectado");
      render();
      loadFromDrive();
    } else {
      showToast("Error conectando Drive: " + (data.error || "desconocido"));
    }
  } catch(e) {
    console.error("OAuth callback error:", e);
    showToast("Error conectando Drive");
  }
}

async function refreshDriveToken() {
  if (!state.driveRefreshToken) return false;
  try {
    const res = await fetch("/auth/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ grant_type: "refresh_token", refresh_token: state.driveRefreshToken })
    });
    const data = await res.json();
    if (data.access_token) {
      state.driveToken = data.access_token;
      state.driveTokenExpiry = Date.now() + (data.expires_in || 3600) * 1000;
      localStorage.setItem("drive_token", data.access_token);
      localStorage.setItem("drive_token_expiry", String(state.driveTokenExpiry));
      return true;
    }
  } catch(e) {
    console.error("Refresh token error:", e);
  }
  return false;
}

async function ensureValidToken() {
  // Token válido con más de 5 min de vida → OK
  if (state.driveToken && state.driveTokenExpiry && Date.now() < state.driveTokenExpiry - 5*60*1000) {
    return true;
  }
  // Intentar refresh silencioso
  if (state.driveRefreshToken) {
    return await refreshDriveToken();
  }
  // Sin refresh token y access token vencido → necesita relogin
  if (state.driveToken) {
    await handleTokenExpired();
  }
  return false;
}

function hoy() { return new Date().toISOString().split("T")[0]; }
function buildHoraSel(val, fn) {

function horaFrom(hh,mm){ return (!hh&&!mm)?null:((hh||"00")+":"+(mm||"00")); }

function setIAHora(hh,mm){ state._iaHora=horaFrom(hh,mm); }

function horaAhora() { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function cmpGastoDesc(a,b) {
  if(a.fecha!==b.fecha) return a.fecha<b.fecha?1:-1;
  const ha=a.hora||"", hb=b.hora||"";
  if(ha&&hb&&ha!==hb) return ha<hb?1:-1;
  return (parseInt(b.id)||0)-(parseInt(a.id)||0);
}

function fmtMonto(n, m) {
  const sym = m==="U$S"?"U$S ":m==="Euros"?"€":m==="CLP"?"CLP ":"$";
  return sym + Number(n).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0});
}

function medioStr(m, sm) { return m?(sm?`${m} · ${sm}`:m):null; }
function esTCMedio(m){return m==="TC ARS"||m==="TC U$S"||m==="TC EUR";}
function esCuotasMode(medio,tcCuotas){return medio==="E-cheque"||(esTCMedio(medio)&&!!tcCuotas);}
function getTitularesConocidos() {
  const set = new Set(
    state.gastos
      .map(g => (g.titular || "").trim())
      .filter(t => t.length > 0)
  );
  return [...set].sort((a, b) => a.localeCompare(b));
}

function acTitular(inputEl, dropdownId) {
  if (typeof inputEl === "string") inputEl = document.getElementById(inputEl);
  if (!inputEl) return;
  const q = (inputEl.value || "").toLowerCase();
  const todos = getTitularesConocidos();
  const filtrados = q.length === 0
    ? todos
    : todos.filter(t => t.toLowerCase().includes(q));
  const dd = document.getElementById(dropdownId);
  if (!dd) return;
  if (filtrados.length === 0) { dd.style.display = "none"; return; }
  dd.innerHTML = filtrados.map(t =>
    `<div class="ac-item" onmousedown="acElegir(event,'${dropdownId}')">${esc(t)}</div>`
  ).join("");
  dd.style.display = "block";
}

function acElegir(e, dropdownId) {
  e.preventDefault();
  const val = e.target.textContent;
  const dd = document.getElementById(dropdownId);
  if (!dd) return;
  // Actualizar el input correspondiente y el state
  if (dropdownId === "ac-cargar") {
    state.titular = val;
    const inp = document.getElementById("inp-titular");
    if (inp) inp.value = val;
  } else {
    state._editTitular = val;
    // Buscar el input dentro del mismo contenedor
    const inp = dd.previousElementSibling;
    if (inp) inp.value = val;
  }
  dd.style.display = "none";
}

function acCerrar(dropdownId) {
  const dd = document.getElementById(dropdownId);
  if (dd) dd.style.display = "none";
}

function splitSum(parts) { return parts.reduce((s,p)=>s+(parseFloat(p.pct)||0),0); }

function detectarFrecuentes() {
  const count={};
  state.gastos.forEach(g=>{
    const k=`${g.empresa}||${(g.desc||"").toLowerCase().trim()}`;
    if(!count[k]) count[k]={n:0,sample:g};
    count[k].n++;
  });
  return Object.values(count).filter(v=>v.n>=2).map(v=>v.sample);
}

  const partesMedio = (g.medio||"").split(" · ");
  const m = state._editMedio !== undefined ? state._editMedio : (partesMedio[0]||null);
  const sm = state._editSubMedio !== undefined ? state._editSubMedio : (partesMedio[1]||null);
  const eDesc = state._editDesc !== undefined ? state._editDesc : (g.desc||"");
  const eTitular = state._editTitular !== undefined ? state._editTitular : (g.titular||"");
  const eMonto = state._editMonto !== undefined ? state._editMonto : (g.monto||"");
  const eMoneda = state._editMoneda !== undefined ? state._editMoneda : (g.moneda||"ARS");
  const eFecha = state._editFecha !== undefined ? state._editFecha : (g.fecha||hoy());
  const eCats = state._editCats !== undefined ? state._editCats : getCats(g);
  const eNota = state._editNota !== undefined ? state._editNota : (g.nota||"");
  const eEmp = state._editEmpresa !== undefined ? state._editEmpresa : (g.empresa||null);
  const monOpts = ["ARS","U$S","Euros","CLP"].map(mo=>`<option${eMoneda===mo?" selected":""}>${mo}</option>`).join("");
  return `<div class="modal-overlay" onclick="if(event.target===this)cerrarEditarGasto()">
    <div class="modal">
      <div class="modal-header">
        <div style="font-family:monospace;font-size:13px;font-weight:500;color:var(--accent)">✎ Editar gasto</div>
        <button onclick="cerrarEditarGasto()" style="background:none;border:none;color:var(--muted);font-size:20px">✕</button>
      </div>
      <div class="field"><span class="label">Empresa</span>${buildEmpGrid(eEmp,"setEditEmpresa")}</div>
      <div class="field"><span class="label">Titular / Comercio</span><div class="ac-wrap"><input value="${esc(eTitular)}" oninput="state._editTitular=this.value;acTitular(this,'ac-modal')" onfocus="this.select();acTitular(this,'ac-modal')" onblur="setTimeout(()=>acCerrar('ac-modal'),200)" placeholder="Ej: YPF, Mercado Libre..." autocomplete="off"><div id="ac-modal" class="ac-dropdown" style="display:none"></div></div></div>
      <div class="field"><span class="label">Descripción</span><input value="${esc(eDesc)}" oninput="state._editDesc=this.value"></div>
      <div class="field">
        <span class="label" style="display:flex;justify-content:space-between;align-items:center">
          <span>Categoría</span>
          <button onclick="setState({showCats:true})" style="background:none;border:none;color:var(--accent);font-size:11px;font-family:monospace;text-transform:uppercase;letter-spacing:.5px">✎ editar</button>
        </span>
        ${buildCatMultiPicker(eCats,"toggleCatEdit")}
      </div>
      <div class="row2">
        <div class="field"><span class="label">Monto</span><input type="number" value="${eMonto}" oninput="state._editMonto=this.value" step="0.01"></div>
        <div class="field"><span class="label">Moneda</span><select onchange="state._editMoneda=this.value">${monOpts}</select></div>
      </div>
      ${g.splitGroupId ? buildSplitLinkedInfo(g) : ""}
      <div class="row2"><div class="field"><span class="label">Fecha</span><input type="date" value="${eFecha}" onchange="state._editFecha=this.value"></div><div class="field"><span class="label">Hora</span>${buildHoraSel(state._editHora!==undefined?state._editHora:(g.hora||""),"setEditHora")}</div></div>
      <div class="field"><span class="label">Medio de pago</span>${buildMedioPicker(m,sm,"setEditMedio","setEditSubMedio")}</div>
      <div class="field"><span class="label">Pagado por <span style="color:var(--muted);font-weight:400;text-transform:none">(opcional)</span></span>${buildEmpGrid(state._editPagador!==undefined?state._editPagador:(g.pagador||null),"setEditPagador")}</div>
      ${(()=>{const eM2=m||"";const tcCuotasEdit=state._editTcCuotas!==undefined?state._editTcCuotas:!!(g.cantCuotas&&esTCMedio(eM2));const tcToggle=esTCMedio(eM2)?`<div class="field"><span class="label">Modalidad</span><div style="display:flex;gap:8px">${["Pago único","En cuotas"].map(op=>`<button onclick="state._editTcCuotas=${op==='En cuotas'};state._editCantCuotas=undefined;render()" style="flex:1;padding:8px;border-radius:8px;border:1px solid ${(op==='En cuotas')===tcCuotasEdit?'var(--accent)':'var(--border)'};background:${(op==='En cuotas')===tcCuotasEdit?'rgba(245,158,11,.12)':'var(--surface)'};color:${(op==='En cuotas')===tcCuotasEdit?'var(--accent)':'var(--muted)'};font-size:13px;cursor:pointer">${op}</button>`).join('')}</div></div>`:"";const showCuotas=esCuotasMode(eM2,tcCuotasEdit);const cuotasField=showCuotas?`<div class="row2"><div class="field"><span class="label">${eM2==="E-cheque"?"Cantidad de cheques":"Cantidad de cuotas"}</span><input type="number" min="1" step="1" value="${state._editCantCuotas!==undefined?state._editCantCuotas:(g.cantCuotas||"")}" oninput="state._editCantCuotas=this.value;render()" placeholder="Ej: 6"></div><div class="field"><span class="label">Monto por ${eM2==="E-cheque"?"cheque":"cuota"}</span><input type="text" readonly value="${(parseFloat(state._editMonto!==undefined?state._editMonto:g.monto)>0&&parseInt(state._editCantCuotas!==undefined?state._editCantCuotas:g.cantCuotas)>0)?(parseFloat(state._editMonto!==undefined?state._editMonto:g.monto)/parseInt(state._editCantCuotas!==undefined?state._editCantCuotas:g.cantCuotas)).toFixed(2):""}" style="background:var(--surface);color:var(--muted);cursor:default" placeholder="Auto"></div></div>`:"";return tcToggle+cuotasField;})()}

      <button class="btn-primary" onclick="guardarEdicion()">Guardar cambios</button>

    </div>
  </div>`;
}

      <div class="row2 field"><div><span class="label">Fecha</span><input type="date" value="${eF}" onchange="state._iaFecha=this.value"></div><div><span class="label">Hora</span>${buildHoraSel(state._iaHora!==undefined?state._iaHora:horaAhora(),"setIAHora")}</div></div>

      <div class="field"><span class="label">Pagado por <span style="color:var(--muted);font-weight:400;text-transform:none">(opcional)</span></span>${buildEmpGrid(state._iaPagador!==undefined?state._iaPagador:null,"setIAPagador")}</div>
      ${(()=>{const tcCuotasIA=state._iaTcCuotas!==undefined?state._iaTcCuotas:false;const tcToggleIA=esTCMedio(eMed)?`<div class="field"><span class="label">Modalidad</span><div style="display:flex;gap:8px">${["Pago único","En cuotas"].map(op=>`<button onclick="state._iaTcCuotas=${op==='En cuotas'};state._iaCantCuotas=undefined;render()" style="flex:1;padding:8px;border-radius:8px;border:1px solid ${(op==='En cuotas')===tcCuotasIA?'var(--accent)':'var(--border)'};background:${(op==='En cuotas')===tcCuotasIA?'rgba(245,158,11,.12)':'var(--surface)'};color:${(op==='En cuotas')===tcCuotasIA?'var(--accent)':'var(--muted)'};font-size:13px;cursor:pointer">${op}</button>`).join('')}</div></div>`:"";const showCuotasIA=esCuotasMode(eMed,tcCuotasIA);const cuotasFieldIA=showCuotasIA?`<div class="row2"><div class="field"><span class="label">${eMed==="E-cheque"?"Cantidad de cheques":"Cantidad de cuotas"}</span><input type="number" min="1" step="1" value="${state._iaCantCuotas!==undefined?state._iaCantCuotas:""}" oninput="state._iaCantCuotas=this.value;render()" placeholder="Ej: 6"></div><div class="field"><span class="label">Monto por ${eMed==="E-cheque"?"cheque":"cuota"}</span><input type="text" readonly value="${(parseFloat(eM)>0&&parseInt(state._iaCantCuotas)>0)?(parseFloat(eM)/parseInt(state._iaCantCuotas)).toFixed(2):""}" style="background:var(--surface);color:var(--muted);cursor:default" placeholder="Auto"></div></div>`:"";return tcToggleIA+cuotasFieldIA;})()}

const PAGE_SIZE = 50;
function buildLista() {
  const filtrados = state.filtro==="Todos" ? state.gastos : state.gastos.filter(g=>g.empresa===state.filtro);
  const sorted = [...filtrados].sort(cmpGastoDesc);
  const total = sorted.length;
  const visibles = sorted.slice(0, state.listPage * PAGE_SIZE);
  const hayMas = total > visibles.length;
  const filterBtns = ["Todos",...EMPRESAS].map(f=>`<button class="filter-btn${state.filtro===f?" active":""}" onclick="setFiltro('${f}')">${f}</button>`).join("");
  const items = visibles.length ? visibles.map(g=>`
    <div class="gasto-item" onclick="verGasto(${g.id})" style="cursor:pointer">
      <div class="dot" style="background:${EMP[g.empresa]?.border||"#666"}"></div>
      <div style="flex:1;min-width:0">
        <div class="gasto-desc">${g.titular?esc(g.titular):esc(g.desc)}</div>
        <div class="gasto-meta">${g.fecha.split("-").reverse().join("/")}${g.hora?" "+g.hora:""} · ${g.empresa} · ${g.medio||"—"}${g.titular?" · "+esc(g.desc):""}</div>
        ${getCats(g).length?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(getCats(g).join(", "))}</div>`:""}
        ${g.nota?`<div class="gasto-nota">${esc(g.nota)}</div>`:""}
      </div>
      <div class="gasto-monto">
        <div>${fmtMonto(g.monto,g.moneda)}</div>
        ${g.moneda&&g.moneda!=="ARS"?`<div style="font-size:10px;color:var(--muted)">${g.moneda}</div>`:""}
      </div>
      <button class="btn-icon" onclick="event.stopPropagation();editarGasto(${g.id})" title="Editar">✎</button>
      <button class="btn-icon" onclick="event.stopPropagation();eliminarGasto(${g.id})">✕</button>

function esc(s) { return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ── Eventos ────────────────────────────────────────────────────
function attachEvents() {
  // file input
  const fi = document.getElementById("fileInput");
  if (fi) fi.onchange = function(){ handleFile(this); };
  const fiExcel = document.getElementById("fileInputExcel");
  if (fiExcel) fiExcel.onchange = function(){ handleImportExcel(this); };
  // cat drag & drop
  if (state.showCats || state.tab==="categorias") initCatDrag();
}

function initCatDrag() {
  const items = [...document.querySelectorAll(".cat-item")];
  if (!items.length) return;
  let dragIdx = null;

  items.forEach((item, i) => {
    const handle = item.querySelector(".cat-drag-handle");

    // Desktop HTML5 drag
    item.addEventListener("dragstart", e => {
      dragIdx = i;
      e.dataTransfer.effectAllowed = "move";
      setTimeout(() => item.style.opacity = "0.5", 0);
    });
    item.addEventListener("dragover", e => {
      e.preventDefault();
      items.forEach((el, j) => el.style.borderTop = (j === i && i !== dragIdx) ? "2px solid var(--accent)" : "");
    });
    item.addEventListener("dragleave", () => { item.style.borderTop = ""; });
    item.addEventListener("dragend", () => {
      items.forEach(el => { el.style.borderTop = ""; el.style.opacity = ""; });
      dragIdx = null;
    });
    item.addEventListener("drop", e => {
      e.preventDefault();
      items.forEach(el => { el.style.borderTop = ""; el.style.opacity = ""; });
      if (dragIdx !== null && dragIdx !== i) {
        const cats = [...state.categorias];
        const [m] = cats.splice(dragIdx, 1);
        cats.splice(i, 0, m);
        state.categorias = cats;
        localStorage.setItem("cats_reordered_at", Date.now().toString());
        saveAll(); render();
      }
      dragIdx = null;
    });

    // Mobile touch drag
    if (!handle) return;
    handle.addEventListener("touchstart", e => {
      e.preventDefault();
      dragIdx = i;
      item.style.opacity = "0.6";
      item.style.background = "rgba(245,158,11,0.08)";
    }, {passive: false});
    handle.addEventListener("touchmove", e => {
      e.preventDefault();
      const t = e.touches[0];
      const target = document.elementFromPoint(t.clientX, t.clientY)?.closest(".cat-item");
      items.forEach(el => el.style.borderTop = "");
      if (target && target !== item) target.style.borderTop = "2px solid var(--accent)";
    }, {passive: false});
    handle.addEventListener("touchend", e => {
      const t = e.changedTouches[0];
      const target = document.elementFromPoint(t.clientX, t.clientY)?.closest(".cat-item");
      item.style.opacity = "";
      item.style.background = "";
      items.forEach(el => el.style.borderTop = "");
      if (target && target !== item) {
        const targetIdx = items.indexOf(target);
        if (targetIdx !== -1 && dragIdx !== null) {
          const cats = [...state.categorias];
          const [m] = cats.splice(dragIdx, 1);
          cats.splice(targetIdx, 0, m);
          state.categorias = cats;
          localStorage.setItem("cats_reordered_at", Date.now().toString());
          saveAll(); render();
        }
      }
      dragIdx = null;
    }, {passive: true});
  });
}

// ── Acciones ───────────────────────────────────────────────────
function setTab(t) { setState({tab:t}); }
function setFiltro(f) { setState({filtro:f, listPage:1}); }

function calcularTotalesBusqueda(resultados) {
  if (!resultados || resultados.length === 0) return "";
  const MONEDAS = ["ARS","U$S","Euros","CLP"];
  const totales = MONEDAS.map(mon=>{
    const t = resultados.filter(g=>(g.moneda||"ARS")===mon).reduce((s,g)=>s+g.monto,0);
    return t !== 0 ? {mon, t} : null;
  }).filter(Boolean);
  if (totales.length === 0) return "";
  const partes = totales.map(({mon,t})=>`<span style="font-family:monospace;font-weight:700;font-size:16px;color:var(--fg)">${fmtMonto(t,mon)}</span>`).join(`<span style="color:var(--muted);font-size:12px;margin:0 6px">+</span>`);
  return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
    <span style="font-size:12px;color:var(--muted)">Total filtrado</span>
    <span>${partes}</span>
  </div>`;
}

      : resultados.map(g=>`

        <div class="gasto-desc">${g.titular?esc(g.titular):esc(g.desc)}</div>
        <div class="gasto-meta">${g.fecha.split("-").reverse().join("/")}${g.hora?" "+g.hora:""} · ${g.empresa} · ${g.medio||"—"}${g.titular?" · "+esc(g.desc):""}</div>
        ${getCats(g).length?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(getCats(g).join(", "))}</div>`:""}
        ${g.nota?`<div class="gasto-nota">${esc(g.nota)}</div>`:""}
      </div>

        <div>${fmtMonto(g.monto,g.moneda)}</div>
        ${g.moneda&&g.moneda!=="ARS"?`<div style="font-size:10px;color:var(--muted)">${g.moneda}</div>`:""}
      </div>
      <button class="btn-icon" onclick="event.stopPropagation();editarGasto(${g.id})" title="Editar">✎</button>
      <button class="btn-icon" onclick="event.stopPropagation();eliminarGasto(${g.id})">✕</button>
    </div>`).join("");
  const countMsg = hayFiltro && resultados.length > 0
    ? `<div style="font-size:12px;color:var(--muted);margin-bottom:10px">${resultados.length} resultado${resultados.length!==1?"s":""}</div>`
    : "";
  const exportBtn = hayFiltro && resultados.length > 0
    ? `<button onclick="exportarBusqueda()" style="width:100%;padding:10px;background:linear-gradient(135deg,#065F46,#059669);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:12px;cursor:pointer">⬇ Exportar resultados a Excel (${resultados.length})</button>`
    : "";
  const totalHTML = hayFiltro ? calcularTotalesBusqueda(resultados) : "";
  return totalHTML + countMsg + exportBtn + items;
}
function busquedaInput(val) {
  state.busqueda = val;
  const hayActivos = !!(state.busqueda||state.filtroBEmp||(state.filtroBCats&&state.filtroBCats.length)||state.filtroBMedio||state.filtroBPagador||state.filtroDesde||state.filtroHasta);
  const limpiarEl = document.getElementById("buscar-limpiar-wrap");
  if (limpiarEl) limpiarEl.innerHTML = hayActivos
    ? '<button onclick="limpiarFiltrosBusqueda()" style="padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap">✕ Limpiar</button>'
    : '';
  const el = document.getElementById("buscar-results");
  if (el) el.innerHTML = buildBuscarResultsHTML();
}
function toggleFiltroCat(i) {
  const c = state.categorias[i];
  const sel = state.filtroBCats || [];
  setState({filtroBCats: sel.includes(c) ? sel.filter(x=>x!==c) : [...sel, c]});
}
function getFiltradosBusqueda() {
  const q = (state.busqueda||"").toLowerCase().trim();
  const emp = state.filtroBEmp||"";
  const cats = state.filtroBCats||[];
  const med = state.filtroBMedio||"";
  const pag = state.filtroBPagador||"";
  const desde = state.filtroDesde||"";
  const hasta = state.filtroHasta||"";
  const hayFiltro = q||emp||cats.length||med||pag||desde||hasta;
  if(!hayFiltro) return null;
  return [...state.gastos].filter(g=>{
    if(q && !((g.titular||"").toLowerCase().includes(q)||(g.desc||"").toLowerCase().includes(q)||(g.nota||"").toLowerCase().includes(q))) return false;

// Voz
let recognition = null;
let _micStream = null;
let _silenceTimer = null;
function _liberarMic() {
  if(_micStream) { _micStream.getTracks().forEach(t=>t.stop()); _micStream=null; }
  if(_silenceTimer) { clearTimeout(_silenceTimer); _silenceTimer=null; }
}
function iniciarVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) { showToast("⚠ Usá el dictado del teclado"); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    _micStream = stream;
    recognition = new SR();
    recognition.lang="es-AR"; recognition.continuous=true; recognition.interimResults=true;
    recognition.onstart = ()=>setState({vozActiva:true,vozStatus:"escuchando"});
    recognition.onresult = e=>{
      const t=Array.from(e.results).map(r=>r[0].transcript).join("");
      state.textoLibre=t;
      state.vozStatus="escuchando"; render();
      // Reiniciar timer de silencio: 4 segundos sin resultado final = detener
      if(_silenceTimer) clearTimeout(_silenceTimer);
      if(e.results[e.results.length-1].isFinal) {
        _silenceTimer = setTimeout(()=>detenerVoz(), 4000);
      }
    };
    recognition.onerror = e=>{ _liberarMic(); setState({vozActiva:false,vozStatus:"error"}); showToast("Error mic: "+e.error); };
    recognition.onend = ()=>{ _liberarMic(); setState({vozActiva:false,vozStatus:"listo"}); };
    recognition.start();
  }).catch(err=>{ showToast("Sin acceso al micrófono: "+err.message); });
}
function detenerVoz() { if(recognition) recognition.stop(); _liberarMic(); setState({vozActiva:false}); }

async function procesarIA() {
  if(!state.imgB64&&!state.textoLibre.trim()) return showToast("⚠ Subí imagen o escribí algo");
  if(!state.iaSplitMode&&!state.empIA) return showToast("⚠ Seleccioná empresa");
  setState({iaLoading:true,iaResult:null});
  try {
    const titularesConocidos = getTitularesConocidos();
    const titularesHint = titularesConocidos.length > 0
      ? ` Para el campo titular: si el comercio/proveedor que encontrás coincide o es muy similar a alguno de esta lista, usá exactamente ese nombre: [${titularesConocidos.join(", ")}]. Si no coincide con ninguno, usá el nombre tal como aparece.`
      : "";
    const subMediosHint = Object.entries(MEDIOS).map(([k,v])=>v.sub&&v.sub.length?`${k}: [${v.sub.join(", ")}]`:"").filter(Boolean).join("; ");
    const prompt = `Hoy es ${hoy()}. ` + (state.textoLibre?`Texto: "${state.textoLibre}". `:"") + `Extraé: titular (nombre del comercio/proveedor), desc (concepto del gasto), monto (número), moneda (ARS/U$S/Euros/CLP), fecha (YYYY-MM-DD o null, si no tiene año usá el año de hoy), medio (Tx/TC ARS/TC U$S/TC EUR/Cash/MP/PayPal/Bizum/Tx U$S Zelle), subMedio (null o el nombre exacto de la tarjeta/sub según esta lista — ${subMediosHint}), categoria (una de: ${state.categorias.join("/")}).${titularesHint} Solo JSON sin backticks.`;
    let messages;
    if(state.imgB64) {
      messages=[{role:"user",content:[{type:"image",source:{type:"base64",media_type:state.imgMime||"image/jpeg",data:state.imgB64}},{type:"text",text:prompt}]}];
    } else {
      messages=[{role:"user",content:`Del texto: "${state.textoLibre.trim()}". ${prompt}`}];
    }
    const res = await fetch("/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:ANTHROPIC_MODEL,max_tokens:500,messages})});
    const data = await res.json();
    if (!data.content) { const errDetail = data.error ? data.error.message || JSON.stringify(data.error) : JSON.stringify(data); throw new Error(errDetail); } const raw = data.content.map(c=>c.text||"").join("").trim();
    const clean = raw.replace(/```json|```/g,"").trim();
    // Try direct parse first, then extract JSON object
    let parsed;
    try {
      parsed = JSON.parse(clean);
    } catch(e1) {
      const jm = clean.match(/\{[\s\S]*\}/);
      if (!jm) throw new Error("Sin JSON: " + clean.slice(0,100));
      try { parsed = JSON.parse(jm[0]); }
      catch(e2) { throw new Error("JSON invalido: " + jm[0].slice(0,100)); }
    }
    setState({iaResult:parsed,iaLoading:false});
  } catch(e) { const errMsg = e.message; console.error('IA Error:', errMsg); showToast("Error IA: "+errMsg); setState({iaLoading:false}); }
}

function fmtMonedaExcel(moneda) {
  if (moneda === "U$S")   return '"U$S "#,##0.00';
  if (moneda === "Euros") return '"€ "#,##0.00';
  if (moneda === "CLP")   return '"CLP "#,##0';
  return '"$ "#,##0.00';
}

function aplicarEstilosHoja(ws, rows, numCatCols) {
  numCatCols = numCatCols || 1;
  const colMonedaIdx0 = 6 + numCatCols;       // índice 0-based dentro del array de la fila
  const colMontoTotal1 = 8 + numCatCols;      // columna 1-based de Excel
  const colMontoCuota1 = 10 + numCatCols;     // columna 1-based de Excel
  const totalCols = 13 + numCatCols;

  const HEADER_FILL = { type:"pattern", pattern:"solid", fgColor:{argb:"FF1E3A5F"} };
  const HEADER_FONT = { name:"Arial", bold:true, color:{argb:"FFFFFFFF"}, size:10 };
  const BODY_FONT   = { name:"Arial", size:10 };
  const BRD         = { style:"thin", color:{argb:"FFD0D0D0"} };
  const BORDER      = { top:BRD, left:BRD, bottom:BRD, right:BRD };

  ws.getRow(1).eachCell(cell => {
    cell.font = HEADER_FONT;
    cell.fill = HEADER_FILL;
    cell.alignment = { vertical:"middle", horizontal:"center" };
    cell.border = BORDER;
  });
  ws.getRow(1).height = 20;

  rows.forEach((row, ri) => {
    const exRow = ws.getRow(ri + 2);
    const zebra = ri % 2 === 0;
    const moneda = row[colMonedaIdx0] || "ARS";
    exRow.eachCell({ includeEmpty:true }, (cell, colIdx) => {
      cell.font = BODY_FONT;
      cell.border = BORDER;
      cell.alignment = { vertical:"middle" };
      if (zebra) cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:"FFF5F8FF"} };
      if (colIdx === 1 && cell.value) {
        const d = new Date(cell.value + "T00:00:00");
        if (!isNaN(d)) { cell.value = d; cell.numFmt = "dd/mm/yyyy"; }
      }
      if ((colIdx === colMontoTotal1 || colIdx === colMontoCuota1) && typeof cell.value === "number") {
        cell.numFmt = fmtMonedaExcel(moneda);
        cell.alignment = { vertical:"middle", horizontal:"right" };
      }
    });
    exRow.height = 18;
  });

  const widths = [12,12,24,32, ...Array(numCatCols).fill(18), 16,16,8,14,10,14,28,12,8];
  widths.forEach((w,i) => { ws.getColumn(i+1).width = w; });
  ws.views = [{ state:"frozen", ySplit:1 }];
  ws.autoFilter = { from:{row:1,column:1}, to:{row:1,column:totalCols} };
}

function colLetter(n) {
  let s = "";
  while (n > 0) { const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = Math.floor((n-1)/26); }
  return s;
}

// Crea una hoja oculta con las listas maestras (empresas, categorías, medios, subtipos, monedas)
// y devuelve los rangos para usar en las validaciones de datos (dropdowns) de las demás hojas.
function crearHojaListas(wb) {
  const ws = wb.addWorksheet("Listas");
  ws.state = "hidden";
  const medios = Object.keys(MEDIOS).sort((a,b)=>a.localeCompare(b));
  const subtiposFlat = [...new Set(Object.values(MEDIOS).flatMap(m=>m.sub||[]))].sort((a,b)=>a.localeCompare(b));
  const monedas = ["ARS","U$S","Euros","CLP"];
  const cols = [
    {header:"Empresa", values: EMPRESAS},
    {header:"Categoría", values: state.categorias},
    {header:"Medio de pago", values: medios},
    {header:"Subtipo", values: subtiposFlat},
    {header:"Moneda", values: monedas},
  ];
  cols.forEach((c, ci) => {
    ws.getCell(1, ci+1).value = c.header;
    c.values.forEach((v, ri) => { ws.getCell(ri+2, ci+1).value = v; });
  });
  const rango = (colIdx1, n) => `Listas!$${colLetter(colIdx1)}$2:$${colLetter(colIdx1)}$${Math.max(n,1)+1}`;
  return {
    empresaRange: rango(1, EMPRESAS.length),
    categoriaRange: rango(2, state.categorias.length),
    medioRange: rango(3, medios.length),
    subtipoRange: rango(4, subtiposFlat.length),
    monedaRange: rango(5, monedas.length),
  };
}

// Aplica dropdowns (validación de datos) a una hoja de gastos, incluyendo filas vacías
// para que al agregar filas nuevas para carga masiva también tengan la lista.
function aplicarValidacionesHoja(ws, numCatCols, ranges, maxFilas) {
  maxFilas = maxFilas || 500;
  const colEmpresa = colLetter(2);
  const colMedio = colLetter(5+numCatCols);
  const colSubtipo = colLetter(6+numCatCols);
  const colMoneda = colLetter(7+numCatCols);
  const dv = (range) => ({ type:"list", allowBlank:true, formulae:[range] });

  ws.dataValidations.add(`${colEmpresa}2:${colEmpresa}${maxFilas}`, dv(ranges.empresaRange));
  for (let c=0; c<numCatCols; c++) {
    const colC = colLetter(5+c);
    ws.dataValidations.add(`${colC}2:${colC}${maxFilas}`, dv(ranges.categoriaRange));
  }
  ws.dataValidations.add(`${colMedio}2:${colMedio}${maxFilas}`, dv(ranges.medioRange));
  ws.dataValidations.add(`${colSubtipo}2:${colSubtipo}${maxFilas}`, dv(ranges.subtipoRange));
  ws.dataValidations.add(`${colMoneda}2:${colMoneda}${maxFilas}`, dv(ranges.monedaRange));
  const colPagador = colLetter(12+numCatCols);
  ws.dataValidations.add(`${colPagador}2:${colPagador}${maxFilas}`, dv(ranges.empresaRange));
}

// ── Importación desde Excel ────────────────────────────────────
function parseFechaImport(val) {
  if (val === null || val === undefined || val === "") return null;
  if (val instanceof Date) {
    const y=val.getFullYear(), m=String(val.getMonth()+1).padStart(2,"0"), d=String(val.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  if (typeof val === "number") {
    // Serial de fecha de Excel (días desde 1899-12-30)
    const ms = Math.round((val - 25569) * 86400 * 1000);
    const d = new Date(ms);
    const y=d.getUTCFullYear(), m=String(d.getUTCMonth()+1).padStart(2,"0"), day=String(d.getUTCDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  const s = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (dmy) { const [,d,m,y]=dmy; return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  const parsed = new Date(s);
  if (!isNaN(parsed)) {
    const y=parsed.getFullYear(), m=String(parsed.getMonth()+1).padStart(2,"0"), d=String(parsed.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  return null;
}

async function handleImportExcel(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = "";
  showToast("Leyendo archivo...");
  try {
    const buf = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);

    // Si hay una hoja "Todos" (export completo), usar solo esa para no duplicar
    // lo que ya está repetido en las hojas por empresa. La hoja "Listas" es interna
    // (fuente de los desplegables) y nunca se procesa como datos.
    const hojasDatos = wb.worksheets.filter(ws => ws.name !== "Listas");
    const todosSheet = hojasDatos.find(ws => ws.name === "Todos");
    const hojas = todosSheet ? [todosSheet] : hojasDatos;

    const nuevos = [];
    const errores = [];

    hojas.forEach(ws => {
      const headerRow = ws.getRow(1);
      const colMap = {};
      const catCols = [];
      headerRow.eachCell((cell, colIdx) => {
        const h = String(cell.value||"").trim().toLowerCase();
        if (h.startsWith("categoría") || h.startsWith("categoria")) catCols.push(colIdx);
        else if (h) colMap[h] = colIdx;
      });
      const get = (row, key) => { const idx = colMap[key]; if(!idx) return ""; const c = row.getCell(idx); return (c && c.value !== null && c.value !== undefined) ? c.value : ""; };

      const totalRows = ws.rowCount;
      for (let r = 2; r <= totalRows; r++) {
        const row = ws.getRow(r);
        if (row.actualCellCount === 0) continue;

        const empresaRaw = String(get(row,"empresa")||"").trim();
        const empresa = EMPRESAS.find(e => e.toLowerCase() === empresaRaw.toLowerCase());
        const monto = parseFloat(get(row,"monto total"));
        const fecha = parseFechaImport(get(row,"fecha"));

        if (!empresa) { errores.push(`Hoja "${ws.name}" fila ${r}: empresa "${empresaRaw}" no reconocida`); continue; }
        if (!fecha) { errores.push(`Hoja "${ws.name}" fila ${r}: fecha inválida`); continue; }
        if (!monto || monto<=0) { errores.push(`Hoja "${ws.name}" fila ${r}: monto inválido`); continue; }

        const categorias = catCols.map(ci => { const c = row.getCell(ci); return (c && c.value) ? String(c.value).trim() : ""; }).filter(Boolean);
        const medioBase = String(get(row,"medio de pago")||"").trim();
        const subtipo = String(get(row,"subtipo")||"").trim();
        const monedaRaw = String(get(row,"moneda")||"").trim();
        const moneda = ["ARS","U$S","Euros","CLP"].includes(monedaRaw) ? monedaRaw : "ARS";
        const pagadorRaw = String(get(row,"pagado por")||"").trim();
        const horaRaw = get(row,"hora");
        let hora = null;
        if (horaRaw instanceof Date) hora = String(horaRaw.getUTCHours()).padStart(2,"0")+":"+String(horaRaw.getUTCMinutes()).padStart(2,"0");
        else if (typeof horaRaw === "number") { const t=Math.round(horaRaw*24*60); hora = String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }
        else { const s=String(horaRaw||"").trim(); const mH=s.match(/^(\d{1,2}):(\d{2})/); if(mH) hora = mH[1].padStart(2,"0")+":"+mH[2]; }
        const pagador = EMPRESAS.find(e => e.toLowerCase() === pagadorRaw.toLowerCase()) || null;
        const cantCuotasRaw = get(row,"cant. cuotas");
        const cantCuotas = cantCuotasRaw ? parseInt(cantCuotasRaw) : null;
        const montoCuotaRaw = get(row,"monto/cuota");
        let montoCuota = montoCuotaRaw ? parseFloat(montoCuotaRaw) : null;
        if (!montoCuota && cantCuotas>0) montoCuota = Math.round(monto/cantCuotas*100)/100;

        nuevos.push({
          id: Date.now() + nuevos.length,
          empresa, fecha,
          titular: String(get(row,"titular/comercio")||"").trim(),
          desc: String(get(row,"descripción")||get(row,"descripcion")||"").trim() || "Sin descripción",
          categorias: categorias.length ? categorias : ["Sin categoría"],
          medio: medioStr(medioBase||null, subtipo||null) || medioBase || "No especificado",
          moneda, monto,
          cantCuotas: cantCuotas>0?cantCuotas:null,
          montoCuota: montoCuota>0?montoCuota:null,
          nota: String(get(row,"nota")||"").trim(),
          pagador,
          hora,
          updatedAt: Date.now(),
        });
      }
    });

    if (!nuevos.length) {
      if (errores.length) console.warn("Errores de importación:", errores);
      showToast(errores.length ? `⚠ No se importó nada (${errores.length} filas con error, ver consola)` : "⚠ El archivo no tiene filas para importar");
      return;
    }

    const msg = `¿Importar ${nuevos.length} gasto${nuevos.length!==1?"s":""}?` + (errores.length ? `\n\n${errores.length} fila${errores.length!==1?"s":""} se van a omitir por datos inválidos (detalle en la consola).` : "");
    if (!confirm(msg)) return;

    state.gastos = [...state.gastos, ...nuevos];
    saveAll();
    render();
    if (errores.length) console.warn("Filas omitidas en la importación:", errores);
    showToast(`✓ ${nuevos.length} gastos importados${errores.length?` (${errores.length} omitidos)`:""}`);
  } catch(e) {
    console.error("Error importando Excel:", e);
    showToast("⚠ Error leyendo el archivo: " + e.message);
  }
}

async function descargarPlantillaExcel() {
  const wb = new ExcelJS.Workbook();
  wb.creator = "Gastos App"; wb.created = new Date();
  const numCat = 3;
  const catHeaders = Array.from({length:numCat},(_,i)=>`Categoría ${i+1}`);
  const headers = ["Fecha","Empresa","Titular/Comercio","Descripción",...catHeaders,"Medio de pago","Subtipo","Moneda","Monto Total","Cant. Cuotas","Monto/Cuota","Nota","Pagado por","Hora"];
  const ws = wb.addWorksheet("Plantilla");
  ws.addRow(headers);
  aplicarEstilosHoja(ws, [], numCat);
  const ranges = crearHojaListas(wb);
  aplicarValidacionesHoja(ws, numCat, ranges);
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));

  a.click();
  showToast("✓ Plantilla descargada");
}

async function exportarExcel(soloEmp) {
  if(!state.gastos.length) return showToast("No hay gastos para exportar");
  const wb = new ExcelJS.Workbook();
  wb.creator = "Gastos App"; wb.created = new Date();
  const splitMedio = g => { const p=(g.medio||"").split(" · "); return [p[0]||"",p[1]||""]; };
  const catHeaders = n => n<=1 ? ["Categoría"] : Array.from({length:n},(_,i)=>`Categoría ${i+1}`);
  const buildHeaders = n => ["Fecha","Empresa","Titular/Comercio","Descripción",...catHeaders(n),"Medio de pago","Subtipo","Moneda","Monto Total","Cant. Cuotas","Monto/Cuota","Nota","Pagado por","Hora"];
  const toRow = (g,n) => { const cats=getCats(g); const catCols=Array.from({length:n},(_,i)=>cats[i]||""); return [g.fecha, g.empresa, g.titular||"", g.desc, ...catCols, ...splitMedio(g), g.moneda||"ARS", g.monto, g.cantCuotas||"", g.montoCuota||"", g.nota||"", g.pagador||"", g.hora||""]; };

  const descargar = async (nombre) => {
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download = nombre; a.click();
  };

  const fechaFiltro = g => (!state.exportDesde||g.fecha>=state.exportDesde)&&(!state.exportHasta||g.fecha<=state.exportHasta);
  const sufFecha = (state.exportDesde||state.exportHasta) ? `_${state.exportDesde||"inicio"}_${state.exportHasta||"hoy"}` : "";

  let ranges = null;
  const addSheet = (nombreHoja, gastosArr) => {
    const numCat = Math.max(1, ...gastosArr.map(g=>getCats(g).length));
    const headers = buildHeaders(numCat);
    const rows = gastosArr.map(g=>toRow(g,numCat));
    const ws = wb.addWorksheet(nombreHoja);
    ws.addRow(headers); rows.forEach(r=>ws.addRow(r));
    aplicarEstilosHoja(ws, rows, numCat);
    if (!ranges) ranges = crearHojaListas(wb);
    aplicarValidacionesHoja(ws, numCat, ranges);
    return rows.length;
  };

  if (soloEmp) {
    const gastosArr = state.gastos.filter(g=>g.empresa===soloEmp&&fechaFiltro(g)).sort((a,b)=>cmpGastoDesc(b,a));
    if (!gastosArr.length) return showToast(`Sin gastos para ${soloEmp}${sufFecha?" en ese período":""}`);
    const n = addSheet(soloEmp, gastosArr);
    await descargar(`gastos_${soloEmp}${sufFecha}_${hoy()}.xlsx`);
    showToast(`✓ Excel ${soloEmp} exportado (${n} gastos)`);
    return;
  }

  EMPRESAS.forEach(emp => {
    const gastosArr = state.gastos.filter(g=>g.empresa===emp&&fechaFiltro(g)).sort((a,b)=>cmpGastoDesc(b,a));
    addSheet(emp, gastosArr);
  });
  const allArr = [...state.gastos].filter(fechaFiltro).sort((a,b)=>cmpGastoDesc(b,a));
  const totalN = addSheet("Todos", allArr);
  await descargar(`gastos${sufFecha}_${hoy()}.xlsx`);
  showToast(`✓ Excel exportado (${totalN} gastos)`);
}

async function exportarBusqueda() {
  const resultados = getFiltradosBusqueda();
  if(!resultados||!resultados.length) return showToast("Sin resultados para exportar");
  const splitMedio = g => { const p=(g.medio||"").split(" · "); return [p[0]||"",p[1]||""]; };
  const sorted = [...resultados].sort((a,b)=>cmpGastoDesc(b,a));
  const numCat = Math.max(1, ...sorted.map(g=>getCats(g).length));
  const catHeaders = numCat<=1 ? ["Categoría"] : Array.from({length:numCat},(_,i)=>`Categoría ${i+1}`);
  const headers = ["Fecha","Empresa","Titular/Comercio","Descripción",...catHeaders,"Medio de pago","Subtipo","Moneda","Monto Total","Cant. Cuotas","Monto/Cuota","Nota","Pagado por","Hora"];
  const rows = sorted.map(g=>{
    const cats = getCats(g);
    const catCols = Array.from({length:numCat},(_,i)=>cats[i]||"");
    return [g.fecha, g.empresa, g.titular||"", g.desc, ...catCols, ...splitMedio(g), g.moneda||"ARS", g.monto, g.cantCuotas||"", g.montoCuota||"", g.nota||"", g.pagador||"", g.hora||""];
  });
  const wb = new ExcelJS.Workbook();
  wb.creator = "Gastos App"; wb.created = new Date();
  const labelHoja = (state.busqueda||state.filtroBEmp||(state.filtroBCats&&state.filtroBCats.join("+"))||"busqueda").replace(/[^a-zA-Z0-9 áéíóúñÁÉÍÓÚÑ+]/g,"").trim().slice(0,28) || "Busqueda";
  const ws = wb.addWorksheet(labelHoja);
  ws.addRow(headers); rows.forEach(r=>ws.addRow(r));
  aplicarEstilosHoja(ws, rows, numCat);
  const ranges = crearHojaListas(wb);
  aplicarValidacionesHoja(ws, numCat, ranges);
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download = `busqueda_${labelHoja.replace(/\s+/g,"_")}_${hoy()}.xlsx`;
  a.click();
  showToast(`✓ Excel exportado (${resultados.length} gastos)`);
}

// ── Init ──────────────────────────────────────────────────────
localStorage.removeItem("plants_v5");
localStorage.removeItem("deleted_plants_v1");
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch(e => console.error("SW error:", e));
  });
}
handleOAuthCallback();
render();
if (driveEnabled()) { loadFromDrive().then(migrarCatJetsmartTraslados).then(normalizarCasingCategorias); } else { migrarCatJetsmartTraslados(); normalizarCasingCategorias(); }
// Sync periódico cada 2 minutos si hay conexión activa con Drive
setInterval(() => {
  if (driveEnabled() && state.syncStatus !== "syncing") loadFromDrive();
}, 2 * 60 * 1000);
// Sync al volver a la pestaña/app (visibilitychange)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && driveEnabled() && state.syncStatus !== "syncing" && !state.isOffline) {
    loadFromDrive();
  }
});
// Detectar cambios de conectividad
window.addEventListener("offline", () => {
  setState({isOffline: true}, false);
  render();
  showToast("⚡ Sin conexión — los cambios se guardan localmente");
});
window.addEventListener("online", () => {
  setState({isOffline: false}, false);
  render();
  showToast("✓ Conexión restaurada — sincronizando...");
  if (driveEnabled() && state.syncStatus !== "syncing") {
    // Pequeña pausa para que la red esté realmente disponible
    setTimeout(() => loadFromDrive(), 1500);
  }
});
</script>
